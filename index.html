<style>
:root{
  --shelf:#c68a52; --shelf-edge:#9c6534; --shelf-grain:rgba(90,50,20,.18);
  --b1:#e63946; --b2:#ffbe0b; --b3:#3a86ff; --b4:#2a9d8f; --b5:#8338ec; --b6:#fb8500;
  --btn-edge:rgba(0,0,0,.28);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  background:var(--shelf);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --shelf:#8a5a33; --shelf-edge:#5e3a1e; --shelf-grain:rgba(0,0,0,.22); }
}
:root[data-theme="dark"]{ --shelf:#8a5a33; --shelf-edge:#5e3a1e; --shelf-grain:rgba(0,0,0,.22); }
html{ scroll-padding-top:env(safe-area-inset-top,0px); height:100%; }
body{
  height:100%; margin:0; overflow:hidden; background:var(--shelf);
  touch-action:none; user-select:none; -webkit-user-select:none; -webkit-touch-callout:none;
  overscroll-behavior:none; -webkit-tap-highlight-color:transparent;
  font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
}
#app{ height:100%; display:flex; flex-direction:column; }
#stage{ flex:1; position:relative; min-height:0; background:#8acb68; }
#c{ position:absolute; inset:0; width:100%; height:100%; display:block; touch-action:none; }
#bar{
  flex:none; display:flex; justify-content:center; align-items:center;
  gap:clamp(6px,2.4vw,24px); padding:12px 8px 14px;

    repeating-linear-gradient(92deg, transparent 0 22px, var(--shelf-grain) 22px 24px, transparent 24px 61px),
    var(--shelf);
  border-top:5px solid var(--shelf-edge);
}
.btn{
  position:relative; flex:none;
  width:clamp(46px,13.4vw,84px); height:clamp(46px,13.4vw,84px);
  border-radius:50%; border:none; padding:0; margin:0; cursor:pointer;
  font-size:clamp(22px,6.6vw,40px); line-height:1;
  display:grid; place-items:center;
  box-shadow:inset 0 -6px 0 var(--btn-edge), inset 0 5px 0 rgba(255,255,255,.35), 0 5px 0 var(--shelf-edge);
  transition:transform .08s ease, box-shadow .08s ease;
}
.btn:focus-visible{ outline:4px solid #fff; outline-offset:3px; }
.btn.pressed{ transform:translateY(4px); box-shadow:inset 0 -3px 0 var(--btn-edge), inset 0 3px 0 rgba(255,255,255,.3), 0 1px 0 var(--shelf-edge); }
.btn.shake{ animation:shake .35s ease; }
@keyframes shake{ 20%{transform:translateX(-6px)} 40%{transform:translateX(6px)} 60%{transform:translateX(-4px)} 80%{transform:translateX(3px)} }
#bAdd{ background:var(--b1); } #bRemove{ background:var(--b6); } #bHorn{ background:var(--b2); }
#bLight{ background:var(--b4); } #bSpeed{ background:var(--b3); } #bSky{ background:var(--b5); }
.plus{
  position:absolute; top:-2px; right:-2px; width:36%; height:36%; border-radius:50%;
  background:#fff; color:var(--b1); font-weight:900; font-size:clamp(15px,4vw,24px);
  display:grid; place-items:center; box-shadow:0 2px 0 rgba(0,0,0,.25);
}
.plus.minus{ color:var(--b6); }
.tl{ width:38%; height:74%; background:#262626; border-radius:12px; display:flex; flex-direction:column; justify-content:space-evenly; align-items:center; box-shadow:0 2px 0 rgba(0,0,0,.3); }
.tl i{ display:block; width:68%; aspect-ratio:1; border-radius:50%; background:#4a2020; transition:background .15s, box-shadow .15s; }
.tl i.g{ background:#1f3d24; }
.tl.stop i.r{ background:#ff3b3b; box-shadow:0 0 10px #ff5a5a; }
.tl.go i.g{ background:#3ee06a; box-shadow:0 0 10px #5dff88; }
#parent{ position:absolute; top:6px; right:6px; display:flex; gap:6px; z-index:2; }
.pbtn{
  width:36px; height:36px; border-radius:10px; border:none; cursor:pointer; padding:0;
  background:rgba(255,255,255,.5); font-size:18px; opacity:.55; display:grid; place-items:center;
}
.pbtn:focus-visible{ outline:3px solid #fff; opacity:1; }
.pbtn.hold{ opacity:1; transform:scale(1.25); transition:opacity .2s, transform 1.2s linear; }
.pbtn[hidden]{ display:none; }
#bBed{ width:auto; min-width:36px; padding:0 5px; font-size:14px; }
/* bedtime: the sleepy cover over the whole game (the parent corner stays on top of it) */
#sleep{ position:fixed; inset:0; z-index:1; display:none; opacity:0; transition:opacity 3s ease; overflow:hidden; touch-action:none;
  background:radial-gradient(circle at 50% 44%, rgba(34,46,110,.78), rgba(8,12,40,.94) 75%); }
#sleep.show{ display:block; }
#sleep.on{ opacity:1; }
#sleep .moon{ position:absolute; left:50%; top:44%; font-size:min(30vw,30vh); line-height:1; transform:translate(-50%,-50%);
  animation:sway 7s ease-in-out infinite; filter:drop-shadow(0 0 24px rgba(255,236,160,.55)); }
#sleep .zz{ position:absolute; left:58%; top:30%; font-size:min(10vw,10vh); line-height:1; animation:zz 4.5s ease-in infinite; }
#sleep i{ position:absolute; width:5px; height:5px; border-radius:50%; background:#fff6c8; box-shadow:0 0 6px #fff6c8; animation:tw 3.2s ease-in-out infinite; }
@keyframes tw{ 0%,100%{ opacity:.15 } 50%{ opacity:1 } }
@keyframes zz{ 0%{ transform:translate(0,30px) scale(.6); opacity:0 } 25%{ opacity:1 } 100%{ transform:translate(50px,-70px) scale(1.15); opacity:0 } }
@keyframes sway{ 0%,100%{ transform:translate(-50%,-50%) rotate(-5deg) } 50%{ transform:translate(-50%,-53%) rotate(5deg) } }
</style>

<script>
(() => {

const $ = id => document.getElementById(id);
const stage = $('stage'), cv = $('c'), ctx = cv.getContext('2d');

const TAU = Math.PI * 2;

}
function rr(c, x, y, w, h, r){

  r = Math.max(0, Math.min(r, w / 2, h / 2));

function circle(c, x, y, r){ c.beginPath(); c.arc(x, y, Math.max(0, r), 0, TAU); }

const ENGINE_COLORS = ['#e63946','#3a86ff','#ffbe0b','#2a9d8f','#8338ec','#fb8500','#ff5d8f'];
const WAGON_COLORS = ['#ffadad','#ffd6a5','#fdffb6','#caffbf','#9bf6ff','#a0c4ff','#bdb2ff','#ffc6ff'];

const FLOWERS = ['🌷','🌼','🌻','🌸','🌺'];
const CAR_COLORS = ['#e63946','#3a86ff','#ffbe0b','#2a9d8f','#fb8500','#8338ec','#f15bb5','#f4f4f4'];

/* ================= sound ================= */
let AC = null, muted = false, bellMuted = false, noiseBuf = null;
function audio(){
  if (muted) return null;
  try {
    if (!AC){ const C = window.AudioContext || window.webkitAudioContext; if (!C) return null; AC = new C(); }
    if (AC.state === 'suspended') AC.resume();
  } catch (e) { return null; }

}
function noise(a){
  if (!noiseBuf){ noiseBuf = a.createBuffer(1, a.sampleRate, a.sampleRate); const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1; }

}

function sToot(pitch){
  const a = audio(); if (!a) return;
  const t = a.currentTime;
  const lp = a.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 1500;
  const g = a.createGain(), P = 0.075;
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(P, t + 0.04); g.gain.setValueAtTime(P, t + 0.2);
  g.gain.exponentialRampToValueAtTime(0.0001, t + 0.28);
  g.gain.exponentialRampToValueAtTime(P, t + 0.34); g.gain.setValueAtTime(P, t + 0.72);

    f *= pitch;
    const o = a.createOscillator(); o.type = 'sawtooth';
    o.frequency.setValueAtTime(f * 0.94, t); o.frequency.exponentialRampToValueAtTime(f, t + 0.06);
    const v = a.createOscillator(); v.frequency.value = 6;
    const vg = a.createGain(); vg.gain.value = f * 0.006;
    v.connect(vg); vg.connect(o.frequency); o.connect(lp);

const sDing = () => { tone(784, 'sine', 0, 0.01, 0.9, 0.14); tone(1568, 'sine', 0, 0.01, 0.4, 0.03); tone(622, 'sine', 0.36, 0.01, 1.1, 0.14); tone(1244, 'sine', 0.36, 0.01, 0.4, 0.03); };
const sBloop = () => tone(420, 'sine', 0, 0.01, 0.28, 0.25, 140);

const sNo = () => { tone(220, 'triangle', 0, 0.01, 0.18, 0.2, 180); tone(180, 'triangle', 0.2, 0.01, 0.25, 0.2, 140); };

const sBye = () => [784, 659, 523, 392].forEach((f, i) => tone(f, 'triangle', i * 0.07, 0.01, 0.22, 0.14));
const sBoing = () => tone(260, 'sine', 0, 0.01, 0.35, 0.25, 700);
const sKnock = () => { tone(170, 'sine', 0, 0.004, 0.12, 0.45, 90); tone(170, 'sine', 0.2, 0.004, 0.12, 0.45, 90); };
const sFast = () => tone(300, 'triangle', 0, 0.01, 0.3, 0.18, 1200);
const sSlow = () => tone(900, 'triangle', 0, 0.01, 0.45, 0.18, 220);
const sNight = () => [784, 659, 523, 392].forEach((f, i) => tone(f, 'sine', i * 0.13, 0.02, 0.6, 0.12));

const sBell = () => { if (bellMuted) return; bellHi = !bellHi; tone(bellHi ? 1320 : 1180, 'sine', 0, 0.004, 0.25, 0.035); };

const sRumble = () => { sNoise('lowpass', 220, 0.8, 0.45); tone(55, 'sawtooth', 0, 0.05, 0.7, 0.06); };

// the robber: a tiptoeing tune when he turns up, a cheeky giggle, the police car's "whoop" when it catches him,

const sSneak = () => { [165, 208, 247, 262, 0, 247, 233, 220].forEach((f, i) => f && tone(f, 'triangle', i * 0.16, 0.005, 0.12, 0.22)); tone(1319, 'sine', 1.35, 0.005, 0.25, 0.07); };

// a side road running off the edge of the map, with rounded kerbs where it meets the loop (local frame: x = t, y = -n)
function drawSideRoad(c, jn){
  const h = ROAD_HALF * U, far = jn.off * U, fr = 12 * U;
  const shape = (e, n0) => {
    const r = fr - e;
    c.beginPath(); c.moveTo(-h - fr, -n0); c.lineTo(-h - fr, -(h + e));
    c.arc(-h - fr, -(h + fr), r, Math.PI / 2, 0, true);
    c.lineTo(-h - e, -far); c.lineTo(h + e, -far); c.lineTo(h + e, -(h + fr));
    c.arc(h + fr, -(h + fr), r, Math.PI, Math.PI / 2, true);
    c.lineTo(h + fr, -n0); c.closePath();
  };
  const frame = (dx, dy) => { c.save(); c.translate(jn.x + dx, jn.y + dy); c.rotate(jn.a); };
  frame(2 * U, 3 * U); c.fillStyle = 'rgba(0,0,0,0.15)'; shape(2.5 * U, h + 2.5 * U); c.fill(); c.restore();
  frame(0, 0);
  c.fillStyle = '#d7d2c8'; shape(2.5 * U, h - 2 * U); c.fill();
  c.fillStyle = '#6e737b'; shape(0, h - 2 * U); c.fill();
  c.strokeStyle = 'rgba(255,255,255,0.85)'; c.lineWidth = 2 * U;
  c.save(); c.setLineDash([10 * U, 10 * U]); c.beginPath(); c.moveTo(0, -(h + 8 * U)); c.lineTo(0, -far); c.stroke(); c.restore();
  // give way: a double broken line across the way in
  c.save(); c.setLineDash([4 * U, 3 * U]); c.lineWidth = 1.8 * U;
  for (const n of [h + 2 * U, h + 5.5 * U]){ c.beginPath(); c.moveTo(1 * U, -n); c.lineTo(h - 1 * U, -n); c.stroke(); }
  c.restore();
  c.restore();
}

/* ================= trains ================= */
const trains = [];
const SPEEDS = [42, 100];
let speedIdx = 0, going = true, nightT = 0, night = 0;
const trainLen = tr => tr.lenU * U;

function makeTrain(){
  const used = new Set(trains.map(t => t.color));
  const color = pick(ENGINE_COLORS.filter(c => !used.has(c))) || pick(ENGINE_COLORS);
  const nW = 1 + Math.floor(Math.random() * 3);
  const cars = [{ e: 1, len: 62, jump: 0 }];
  for (let i = 0; i < nW; i++) cars.push({ e: 0, len: 48, color: pick(WAGON_COLORS), animal: pick(ANIMALS), jump: 0 });
  const lenU = cars.reduce((a, c) => a + c.len, 0) + (cars.length - 1) * GAP;
  return { color, cars, lenU, head: 0, v: 0, pause: 0, cool: 0, drag: 0, dragV: 0, bounce: 0, pitch: rand(0.82, 1.22), smokeT: 0, geo: [] };
}
function addTrain(){
  if (trains.length >= 7) return null;
  const nt = makeTrain(), L = trainLen(nt), m = 34 * U;
  if (!trains.length){ nt.head = mod(station.s - 80 * U); trains.push(nt); computeGeo(nt); return nt; }
  const s = [...trains].sort((a, b) => mod(a.head) - mod(b.head));
  let best = -1, bestHead = 0;
  for (let i = 0; i < s.length; i++){
    const B = s[i], A = s[(i + 1) % s.length];
    const d = s.length === 1 ? TL : mod(A.head - B.head);
    const free = d - trainLen(A), spare = free - L - 2 * m;
    if (spare > best){ best = spare; bestHead = B.head + free / 2 + L / 2; }
  }
  if (best < 0) return null;
  nt.head = mod(bestHead); trains.push(nt); computeGeo(nt); return nt;
}
function computeGeo(tr){
  let off = 0; tr.geo.length = 0;
  for (const car of tr.cars){
    const len = car.len * U, f = tr.head - off, b = f - len, P = at(f), Q = at(b);
    tr.geo.push({ x: (P.x + Q.x) / 2, y: (P.y + Q.y) / 2, a: Math.atan2(P.y - Q.y, P.x - Q.x), f, b, len, car });
    off += len + GAP * U;
  }
}
function pushFrom(tr, delta){
  if (trains.length < 2 || !delta) return;
  const s = [...trains].sort((a, b) => mod(a.head) - mod(b.head)), n = s.length, i0 = s.indexOf(tr), m = 10 * U;
  let P = tr;
  for (let k = 1; k < n; k++){
    if (delta > 0){
      const A = s[(i0 + k) % n]; if (A.drag) break;
      const need = trainLen(A) + m;
      if (mod(A.head - P.head) < need){ A.head = mod(P.head + need); A.dragV = Math.max(A.dragV, tr.dragV); } else break;
      P = A;
    } else {
      const B = s[(i0 - k + n) % n]; if (B.drag) break;
      const need = trainLen(P) + m;
      if (mod(P.head - B.head) < need){ B.head = mod(P.head - need); B.dragV = Math.max(B.dragV, tr.dragV); } else break;
      P = B;
    }
  }
}
function tootTrain(tr){
  sToot(tr.pitch); tr.bounce = 0.6;
  const g = tr.geo[0]; if (!g) return;
  for (let i = 0; i < 3; i++) fx.push({ t: 'txt', ch: pick(['♪', '♫']), x: g.x + rand(-10, 10) * U, y: g.y, vx: rand(-25, 25) * U, vy: rand(-70, -45) * U, life: 0, max: 1.3, size: rand(20, 28) * U, col: pick(ENGINE_COLORS), font: 'bold' });
  for (const car of tr.cars) if (!car.e) car.jump = 0.5 + Math.random() * 0.2;
}

function freeSlot(near){

    if (build.fill[k] !== lay) continue;
    if (!near) return k;
    const s = build.slots[k], d = (s.u - near.u) ** 2 + (s.w - near.w) ** 2;
    if (d < bd){ bd = d; best = k; }
  }

}

    build.done = true; build.doneT = 0; sCheer();

  }

function updateWorks(dt){
  if (!works || works.ph < 14 * U) return;
  works.bounce = Math.max(0, works.bounce - dt);
  if (works.rpause > 0){ works.rpause -= dt; return; }
  works.roller += works.rdir * 12 * U * dt * (going ? 1 : 0);

const drags = new Map();

function localPt(e){ const r = cv.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; }
function hitTrain(x, y){
  const pad = Math.max(12 * U, 10), hw = WID * U / 2 + pad;
  let best = null, bd = 1e18;
  for (const tr of trains) for (let k = 0; k < tr.geo.length; k++){
    const g = tr.geo[k], dx = x - g.x, dy = y - g.y, ca = Math.cos(-g.a), sa = Math.sin(-g.a);
    const lx = dx * ca - dy * sa, ly = dx * sa + dy * ca;
    if (Math.abs(lx) < g.len / 2 + pad && Math.abs(ly) < hw){ const d = dx * dx + dy * dy; if (d < bd){ bd = d; best = { tr, k }; } }
  }
  return best;
}
function hitVehicle(x, y){
  const pad = Math.max(8 * U, 8);
  let best = null, bd = 1e18;
  for (const v of vehicles){
    const T = VT[v.type], dx = x - v.x, dy = y - v.y, ca = Math.cos(-v.a), sa = Math.sin(-v.a);
    const lx = dx * ca - dy * sa, ly = dx * sa + dy * ca;
    if (Math.abs(lx) < T.len * U / 2 + pad && Math.abs(ly) < T.wid * U / 2 + pad){ const d = dx * dx + dy * dy; if (d < bd){ bd = d; best = v; } }
  }
  return best;
}
// site machines he can drive: the bulldozer, the digger (body or bucket) and the crane (hook or mast)
function hitMachine(x, y){
  if (!site) return null;
  const q = site.fromW(x, y), pad = Math.max(6 * U, 6);
  if (dozer){
    const c = Math.cos(dozer.a), s = Math.sin(dozer.a), du = q.u - dozer.u, dw = q.w - dozer.w;
    if (Math.abs(du * c + dw * s) < 21 * U + pad && Math.abs(-du * s + dw * c) < 15 * U + pad) return dozer;
  }
  if (ex){ const b = exBucket(); if (Math.hypot(q.u - ex.u, q.w - ex.w) < 24 * U || Math.hypot(q.u - b.u, q.w - b.w) < 12 * U) return ex; }
  if (crane){ const h = craneHook(); if (Math.hypot(q.u - h.u, q.w - h.w) < 16 * U || Math.hypot(q.u - crane.cu, q.w - crane.cw) < 14 * U) return crane; }
  return null;
}

cv.addEventListener('pointerdown', e => {

    const tr = hit.tr, near = nearestS(p.x, p.y, tr.head, TL * 0.3);
    drags.set(e.pointerId, { tr, k: hit.k, off: tr.head - near, sx: p.x, sy: p.y, moved: false, lastT: performance.now() });
    tr.drag++; tr.pause = 0;
    return;
  }
  const sg = site && hitSign(p.x, p.y);
  if (sg){ pressSign(sg); return; }
  const m = hitMachine(p.x, p.y);
  if (m){
    try { cv.setPointerCapture(e.pointerId); } catch (_) {}

});
cv.addEventListener('pointermove', e => {
  if (bed.asleep) return;
  const d = drags.get(e.pointerId); if (!d) return;
  const p = localPt(e);
  if (!d.moved && Math.hypot(p.x - d.sx, p.y - d.sy) > 9){ d.moved = true; if (d.m) grabMachine(d.m); }
  if (!d.moved) return;
  if (d.m){ if (site){ const q = site.fromW(p.x, p.y); d.m.tu = q.u; d.m.tw = q.w; } return; }
  const tr = d.tr, n = nearestS(p.x, p.y, tr.head - d.off, TL * 0.15);
  const newHead = n + d.off, delta = newHead - tr.head;
  const now = performance.now(), dt = Math.max(0.008, (now - d.lastT) / 1000); d.lastT = now;
  tr.dragV = Math.max(tr.dragV, Math.min(260 * U, Math.abs(delta) / dt));
  tr.head = mod(newHead);
  pushFrom(tr, delta);
});
function endDrag(e){
  const d = drags.get(e.pointerId); if (!d) return;

    else { d.m.held = Math.max(0, d.m.held - 1); if (d.m === ex && ex && !ex.held) digRelease(); }

}

  if (v){

    else if (v.robber) tapRobber(v);
    else if (v === rob.cop && rob.v) v.rider === 'robber' ? sGiggle() : sWhoop();
    else vehicleSound(v);
    v.bounce = 0.5; sparkle(v.x, v.y, 8); return;
  }
  if (site){
    const q = site.fromW(x, y);
    if (crane){
      const hu = crane.cu + Math.cos(crane.ang) * crane.r, hw = crane.cw + Math.sin(crane.ang) * crane.r;
      if (Math.hypot(q.u - crane.cu, q.w - crane.cw) < 16 * U || Math.hypot(q.u - hu, q.w - hw) < 14 * U || (site.stack && Math.hypot(q.u - site.stack.u, q.w - site.stack.w) < 16 * U)){
        crane.boost = 5; sClank(); sparkle(x, y, 8); return;
      }
    }
    if (ex && Math.hypot(q.u - ex.u, q.w - ex.w) < 24 * U){ ex.boost = 5; sRumble(); sparkle(x, y, 8); return; }
    if (site.bld){
      const b = site.bld;
      if (q.u > b.u0 - 4 * U && q.u < b.u1 + 4 * U && q.w > b.w0 - 4 * U && q.w < b.w1 + 4 * U){
        if (build.done){ sCheer(); sparkle(x, y, 24); } else { addBlock(nextCol(), false, q); sparkle(x, y, 6); }
        return;
      }
    }
    for (const wk of site.workers){ const p = site.toW(wk.u, wk.w); if (Math.hypot(x - p.x, y - p.y) < 16 * U){ sHello(); emoji(p.x, p.y - 12 * U, '👋', 1, 24); return; } }
    const pile = site.piles.find(p => !p.fade && Math.hypot(q.u - p.u, q.w - p.w) < p.s * U + 4 * U);
    if (pile){
      sNoise('lowpass', 900, 0.4, 0.15);
      const cols = pile.dirt ? ['#8b5a2b', '#a06a35', '#6b4423'] : ['#e9c46a', '#d4a64a', '#f4d58d'];
      for (let i = 0; i < 14; i++){ const a = rand(0, TAU), s = rand(30, 80) * U; fx.push({ t: 'dot', x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 0, max: 0.5, r: rand(1.5, 3) * U, col: pick(cols) }); }
      return;
    }
    if (site.cabin && Math.hypot(q.u - site.cabin.u, q.w - site.cabin.w) < 18 * U){ sKnock(); setTimeout(() => emoji(x, y - 10 * U, pick(['☕', '👷', '👋']), 1, 24), 380); return; }
    if (siteDist(x, y) < 1){ sPop(); sparkle(x, y, 10); return; }
  }
  if (works){
    if (Math.hypot(x - works.worker.x, y - works.worker.y) < 16 * U){ sHello(); emoji(works.worker.x, works.worker.y - 12 * U, '👋', 1, 24); return; }
    if (works.ph >= 14 * U){
      const r = works.toW(works.roller, (ROAD_HALF + 9) * U + works.ph / 2);
      if (Math.hypot(x - r.x, y - r.y) < 18 * U){ sReverse(); works.bounce = 0.5; sparkle(r.x, r.y, 8); return; }
    }
  }
  if (pond && ((x - pond.x) / pond.rx) ** 2 + ((y - pond.y) / pond.ry) ** 2 < 1){
    sBloop(); for (let i = 0; i < 3; i++) puffs.push({ ring: true, x, y, life: -i * 0.18, max: 1.1, r: 4 * U });
    return;
  }
  for (const t of trees) if (Math.hypot(x - t.x, y - t.y) < t.r + 8 * U){
    t.wig = 0.9; sRustle(); emoji(t.x, t.y, t.apples ? '🍎' : '🍃', 2, 16);
    if (Math.random() < 0.3) emoji(t.x, t.y - t.r, '🐦', 1, 22);
    return;
  }
  for (const h of houses) if (Math.hypot(x - h.x, y - h.y) < h.r + 6 * U){
    sKnock(); setTimeout(() => emoji(h.x, h.y - h.r, pick(['🐈', '👋', '🐕', '❤️']), 1, 26), 380); return;
  }
  if (Math.hypot(x - station.cx, y - station.cy) < 48 * U){ sDing(); sparkle(station.cx, station.cy, 12); return; }
  const onRoad = pMinD2(ROAD, x, y, 2) < ((ROAD_HALF + 3) * U) ** 2 || (spur && [spur.CE, spur.CX, spur.SI, spur.SO].some(P => pMinD2(P, x, y, 2) < ((ROAD_HALF + 3) * U) ** 2));
  if (onRoad || Math.sqrt(minD2(x, y)) < 24 * U || (tunnel && Math.hypot(x - tunnel.cx, y - tunnel.cy) < 50 * U)){ sPop(); sparkle(x, y, 14); return; }
  sPop(); sparkle(x, y, 8);
  flowers.push({ nx: x / W, ny: y / H, e: pick(FLOWERS), born: performance.now() / 1000 });
  if (flowers.length > 70) flowers.shift();
}

/* ================= bedtime ================= */
// A play timer the parent sets (10 minutes to start with), so the game ends itself instead of being taken away.
// It winds down gently: a soft chime a minute before, then night falls, a lullaby plays, everything stops, and a
// sleepy night-time cover (a moon, twinkling stars, 💤) fades in over the whole game. Taps do nothing then.
// ⏰ in the parent corner (press and hold 1.2 s) steps the time through 10, 20 and 30 minutes and off, and wakes
// everything up again once it's asleep. Only time with the game on screen counts. It's saved with the setting and
// shared with the other game (the home-screen app can switch between them), and starts afresh after a 20-minute break.
// (The same block is in index.html and builder.html.)
const BED_KEY = 'choochoo-bedtime-v1', BED_OPTS = [10, 20, 30, 0], BED_BREAK = 20 * 60 * 1000;
const bed = { min: 10, used: 0, asleep: false, t: 0, warned: false, saveT: 0, hold: 0, wall: Date.now() };
const bBed = $('bBed'), sleepEl = $('sleep');
const BED_PARENT = ['bBed', 'bBell', 'bMute', 'bFull']; // the only buttons that still work while it's asleep
const sBedWarn = () => { tone(1047, 'sine', 0, 0.02, 0.8, 0.07); tone(784, 'sine', 0.35, 0.02, 1.1, 0.07); };
const sLullaby = () => [392, 392, 587, 587, 659, 659, 587, 523, 523, 494, 494, 440, 440, 392].forEach((f, i) => tone(f, 'sine', i * 0.42 + (i >= 7 ? 0.42 : 0), 0.04, i === 6 || i === 13 ? 1.1 : 0.6, 0.1));
function bedSave(){ try { window.localStorage.setItem(BED_KEY, JSON.stringify({ min: bed.min, used: bed.used, asleep: bed.asleep, at: Date.now() })); } catch (_) {} }
function bedLabel(){ bBed.textContent = '⏰' + (bed.min || '∞'); }
function setLight(){ const tl = $('bLight').firstElementChild; tl.classList.toggle('go', going); tl.classList.toggle('stop', !going); }
function goToSleep(quiet){
  bed.asleep = true; bed.t = quiet ? 10 : 0; bedSave();
  nightT = 1; if (quiet) night = 1; $('bSky').textContent = '☀️';
  going = false; setLight();
  sleepEl.classList.add('show'); // (it takes taps straight away, and fades in a moment later)
  if (quiet) sleepEl.classList.add('on'); else sLullaby();
}
function wakeUp(){
  bed.asleep = false; bed.used = 0; bed.warned = false; bed.t = 0; bedSave();
  sleepEl.classList.remove('show', 'on');
  nightT = 0; $('bSky').textContent = '🌙'; going = true; setLight(); sDay();
}
function nextBedtime(){
  bed.min = BED_OPTS[(BED_OPTS.indexOf(bed.min) + 1) % BED_OPTS.length]; bed.used = 0; bed.warned = false;
  bedLabel(); bedSave(); tone(bed.min ? 440 + bed.min * 20 : 330, 'sine', 0, 0.01, 0.3, 0.15);
}
// first thing every frame: true once it's asleep and everything has stopped (the rest of the update is skipped)
function bedTick(dt){
  const now = Date.now();
  if (now - bed.wall > BED_BREAK){ bed.used = 0; bed.warned = false; if (bed.asleep) wakeUp(); } // back after a long break
  bed.wall = now;
  if (bed.hold && NOW - bed.hold > 1.2){ bed.hold = 0; bBed.classList.remove('hold'); bed.asleep ? wakeUp() : nextBedtime(); }
  if (bed.asleep){
    bed.t += dt;
    if (bed.t > 2.5) sleepEl.classList.add('on');
    return bed.t > 9; // stopped, and the lullaby's finished
  }
  if (!bed.min) return false;
  bed.used += dt;
  if ((bed.saveT -= dt) <= 0){ bed.saveT = 5; bedSave(); }
  const left = bed.min * 60 - bed.used;
  if (!bed.warned && left < 60){ bed.warned = true; sBedWarn(); }
  if (left <= 0) goToSleep(false);
  return false;
}
bBed.addEventListener('pointerdown', e => { e.preventDefault(); e.stopPropagation(); audio(); bed.hold = NOW || 1e-3; bBed.classList.add('hold'); });
for (const t of ['pointerup', 'pointercancel', 'pointerleave']) bBed.addEventListener(t, () => { bed.hold = 0; bBed.classList.remove('hold'); });
window.addEventListener('pagehide', bedSave);
try { // carry on from the other game (or from a moment ago), unless it's been a long break
  const st = JSON.parse(window.localStorage.getItem(BED_KEY) || 'null');
  if (st){
    if (BED_OPTS.includes(st.min)) bed.min = st.min;
    if (Date.now() - st.at < BED_BREAK){ bed.used = st.used || 0; if (st.asleep) goToSleep(true); }
  }
} catch (_) {}
bedLabel();

/* ================= loop ================= */
function updateCrossing(dt){
  if (!spur){ xing.active = false; xing.bar = 0; return; }
  // Trains on (or just past the stop point of) the crossing always keep it closed. Approaching trains
  // close it too, unless a road vehicle has waited a while: then trains hold at the stop point so the
  // road gets a turn (otherwise lots of trains can starve the site trucks forever).
  // A train up to 2U past the stop point is still obeying the signal (it stays put there, see update), so it counts
  // as approaching, not on the crossing. (With "on" starting at 0.5U, a train that overshot into that sliver held the
  // barriers down while it waited for them: a jam for ever. The traffic sim caught it.)
  const stopPt = spur.S - (ROAD_HALF + 6) * U;
  const occupying = trains.some(tr => { const d = mod(tr.head - stopPt); return d > 2 * U && d < trainLen(tr) + (ROAD_HALF + 32) * U; });
  const approaching = trains.some(tr => mod(tr.head - (spur.S - 130 * U)) <= 130 * U - (ROAD_HALF + 6) * U + 2 * U);
  xing.waitT = xing.waiting ? xing.waitT + dt : 0;
  // The hold lasts till a vehicle has actually been over (as in the builder). It used to end the moment nobody was
  // waiting, which was also the moment the barriers finished lifting and the trucks set off, so down they came again
  // in front of them, over and over: with 5 trains a tipper could wait over a minute.
  if (!xing.hold && xing.waitT > 5){ xing.hold = true; xing.holdT = 0; xing.went = false; }
  if (xing.hold){ xing.holdT += dt; if (xing.anyInZone) xing.went = true; if ((xing.went && !xing.waiting && !xing.anyInZone && xing.holdT > 2) || xing.holdT > 15) xing.hold = false; }
  xing.active = occupying || (approaching && !xing.hold);
  const want = xing.active && !xing.anyInZone ? 1 : 0;
  xing.bar = want > xing.bar ? Math.min(1, xing.bar + dt / 0.8) : Math.max(0, xing.bar - dt / 0.8);
  if (xing.active || xing.bar > 0.02){ xing.bellT -= dt; if (xing.bellT <= 0){ sBell(); xing.bellT = 0.45; } } else xing.bellT = 0;
}
function update(dt){
  if (bedTick(dt)) return;
  if (resetHold && NOW - resetHold > 1.2){ resetHold = 0; bReset.classList.remove('hold'); resetAll(); return; }
  night += clamp(nightT - night, -dt * 1.2, dt * 1.2);
  const target = SPEEDS[speedIdx] * U;
  const s = [...trains].sort((a, b) => mod(a.head) - mod(b.head));
  for (let i = 0; i < s.length; i++){
    const tr = s[i];
    tr.bounce = Math.max(0, tr.bounce - dt); tr.cool = Math.max(0, tr.cool - dt);
    tr.dragV *= Math.exp(-dt * 6);
    for (const car of tr.cars) car.jump = Math.max(0, car.jump - dt);
    if (tr.drag){ tr.v = 0; continue; }
    tr.pause = Math.max(0, tr.pause - dt);
    let want = going && tr.pause <= 0 ? target : 0;
    if (s.length > 1){
      const A = s[(i + 1) % s.length], gap = mod(A.head - tr.head) - trainLen(A) - 16 * U;
      want = Math.min(want, Math.max(0, gap * 2.5));
    }
    if (spur && (xing.anyInZone || xing.bar < 0.95 || xing.hold)){
      let d = mod(spur.S - (ROAD_HALF + 6) * U - tr.head);
      if (d > TL - 2 * U) d = 0; // nose just past the stop point: stay put
      if (d < 150 * U) want = Math.min(want, Math.max(0, d * 2.5));
    }
    tr.v = want < tr.v ? Math.max(want, tr.v - 320 * U * dt) : Math.min(want, tr.v + 70 * U * dt);
    const prev = tr.head, step = tr.v * dt;
    tr.head = mod(tr.head + step);
    if (going && tr.cool <= 0 && step > 0 && mod(station.s - prev) < step){ tr.pause = 1.8; tr.cool = 5; sDing(); }
    // train wash: about 2 in 5 trains stop with the engine in the shed for a scrub
    if (trainWash && going && step > 0 && tr.pause <= 0 && mod(trainWash.sStop - prev) < step && Math.random() < 0.45){ tr.pause = 3.2; tr.wash = 3.2; sSpray(); }
  }
  for (const tr of trains){
    computeGeo(tr);
    if (tr.wash > 0){
      tr.wash -= dt; if (trainWash) trainWash.busy = 0.3;
      const g = tr.geo[0]; if (g && Math.random() < dt * 14) bubbles(g.x, g.y, 2, g.len * 0.45);
      if (tr.wash <= 0){ tr.shine = 5; if (g) sparkle(g.x, g.y, 14); }
    }
    if (tr.shine > 0){ tr.shine -= dt; const g = tr.geo[0]; if (g && Math.random() < dt * 6) sparkle(g.x + rand(-20, 20) * U, g.y + rand(-10, 10) * U, 1); }
    const speed = tr.drag ? tr.dragV : Math.max(tr.v, tr.dragV);
    tr.smokeT -= dt;
    if (speed > 6 * U && tr.smokeT <= 0 && !inTunnel(tr.head - 12 * U)){
      const g = tr.geo[0], ch = g.len / 2 - 12 * U;
      spawnPuff(g.x + Math.cos(g.a) * ch, g.y + Math.sin(g.a) * ch);
      tr.smokeT = 0.34 - Math.min(1, speed / (150 * U)) * 0.22;
    }
  }
  updateVehicles(dt);
  updateTraffic(dt);
  updateRobber(dt);
  updateCrossing(dt);
  updateSite(dt);
  updateWorks(dt);
  for (const w of [carWash, trainWash]) if (w){ w.busy = Math.max(0, w.busy - dt); w.spin += dt * (w.busy > 0 ? 14 : 0.6); }
  for (let i = puffs.length - 1; i >= 0; i--){
    const p = puffs[i]; p.life += dt;
    if (p.life > p.max){ puffs.splice(i, 1); continue; }
    if (!p.ring){ p.x += p.vx * dt; p.y += p.vy * dt; p.r += p.vr * dt; }
  }
  for (let i = fx.length - 1; i >= 0; i--){
    const p = fx[i]; p.life += dt;
    if (p.life > p.max){ fx.splice(i, 1); continue; }
    p.x += p.vx * dt; p.y += p.vy * dt;
    if (p.g) p.vy += p.g * dt; else if (p.t === 'dot'){ p.vx *= Math.exp(-dt * 3); p.vy *= Math.exp(-dt * 3); }
  }
  if (fx.length > 400) fx.splice(0, fx.length - 400);
  for (const t of trees) t.wig = Math.max(0, t.wig - dt);
  duck.flap = Math.max(0, duck.flap - dt);
}

function drawTree(c, t){
  const w = t.wig > 0 ? Math.sin(t.wig * 26) * t.wig * 0.2 : 0, r = t.r;
  c.save(); c.translate(t.x, t.y);
  c.fillStyle = 'rgba(0,0,0,0.18)'; c.beginPath(); c.ellipse(4 * U, 6 * U, r * 1.1, r * 0.95, 0, 0, TAU); c.fill();
  c.rotate(w); c.scale(1 + w * 0.6, 1 - w * 0.4);
  c.fillStyle = t.dark;
  circle(c, -r * 0.38, r * 0.12, r * 0.72); c.fill(); circle(c, r * 0.38, r * 0.16, r * 0.72); c.fill(); circle(c, 0, -r * 0.3, r * 0.78); c.fill();
  c.fillStyle = shade(t.dark, 0.25); circle(c, -r * 0.18, -r * 0.36, r * 0.42); c.fill();
  if (t.apples){ c.fillStyle = '#e63946'; for (const [ax, ay] of [[0.3, -0.2], [-0.45, 0.25], [0.15, 0.45], [-0.1, -0.6]]){ circle(c, ax * r, ay * r, 2.4 * U); c.fill(); } }
  c.restore();
}
function drawTunnel(c){
  const { s0 } = tunnel, span = mod(tunnel.s1 - s0), pts = [];
  for (let d = 0; d < span; d += STEP * 2) pts.push(at(s0 + d));
  pts.push(at(s0 + span));
  const line = () => { c.beginPath(); c.moveTo(pts[0].x, pts[0].y); for (const p of pts) c.lineTo(p.x, p.y); c.stroke(); };
  c.lineCap = 'butt'; c.lineJoin = 'round';
  c.save(); c.translate(3 * U, 5 * U); c.strokeStyle = 'rgba(0,0,0,0.2)'; c.lineWidth = 80 * U; line(); c.restore();
  c.strokeStyle = '#4c9a3c'; c.lineWidth = 80 * U; line();
  c.strokeStyle = '#5db34a'; c.lineWidth = 64 * U; line();
  c.strokeStyle = '#6fc25a'; c.lineWidth = 38 * U; line();
  const m = at(s0 + span / 2);
  c.fillStyle = '#7fcf68'; circle(c, m.x - 6 * U, m.y - 6 * U, 16 * U); c.fill();
  c.fillStyle = '#e63946'; circle(c, m.x + 10 * U, m.y + 8 * U, 3 * U); c.fill();
  c.fillStyle = '#ffd23f'; circle(c, m.x - 14 * U, m.y + 14 * U, 3 * U); c.fill();
  for (const [s, dir] of [[s0, -1], [s0 + span, 1]]){
    const p = at(s);
    c.save(); c.translate(p.x, p.y); c.rotate(p.a);
    c.fillStyle = '#9a8e84'; rr(c, -6 * U, -32 * U, 12 * U, 64 * U, 4 * U); c.fill();
    c.strokeStyle = 'rgba(0,0,0,0.25)'; c.lineWidth = 1.2 * U;
    for (const y of [-18, -4, 10, 24]){ c.beginPath(); c.moveTo(-6 * U, y * U); c.lineTo(6 * U, y * U); c.stroke(); }
    c.fillStyle = '#2a211c'; rr(c, dir > 0 ? 2 * U : -6 * U, -18 * U, 4 * U, 36 * U, 2 * U); c.fill();
    c.restore();
  }
}
const xLights = [];
function drawCrossing(c, time){
  xLights.length = 0;
  if (!spur) return;
  const { o, p } = spur, warn = xing.active || xing.bar > 0.02, bl = Math.floor(time * 2.4) % 2 === 0;
  const k = ease(xing.bar);
