<style>
:root{
  --shelf:#c68a52; --shelf-edge:#9c6534; --shelf-grain:rgba(90,50,20,.18);
  --b1:#e63946; --b2:#ffbe0b; --b3:#3a86ff; --b4:#2a9d8f; --b5:#8338ec; --b6:#fb8500;
  --btn-edge:rgba(0,0,0,.28);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  background:var(--shelf);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --shelf:#8a5a33; --shelf-edge:#5e3a1e; --shelf-grain:rgba(0,0,0,.22); }
}
:root[data-theme="dark"]{ --shelf:#8a5a33; --shelf-edge:#5e3a1e; --shelf-grain:rgba(0,0,0,.22); }
html{ scroll-padding-top:env(safe-area-inset-top,0px); height:100%; }
body{
  height:100%; margin:0; overflow:hidden; background:var(--shelf);
  touch-action:none; user-select:none; -webkit-user-select:none; -webkit-touch-callout:none;
  overscroll-behavior:none; -webkit-tap-highlight-color:transparent;
  font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
}
#app{ height:100%; display:flex; flex-direction:column; }
#stage{ flex:1; position:relative; min-height:0; background:#8acb68; }
#c, #c3{ position:absolute; inset:0; width:100%; height:100%; display:block; touch-action:none; }
#c3[hidden]{ display:none; }
#bar{
  flex:none; display:flex; justify-content:center; align-items:center;
  gap:clamp(4px,1.9vw,24px); padding:12px 8px 14px;
  background:
    repeating-linear-gradient(92deg, transparent 0 22px, var(--shelf-grain) 22px 24px, transparent 24px 61px),
    var(--shelf);
  border-top:5px solid var(--shelf-edge);
}
.btn{
  position:relative; flex:none;
  width:clamp(38px,11.6vw,84px); height:clamp(38px,11.6vw,84px);
  border-radius:50%; border:none; padding:0; margin:0; cursor:pointer;
  font-size:clamp(19px,5.8vw,40px); line-height:1;
  display:grid; place-items:center;
  box-shadow:inset 0 -6px 0 var(--btn-edge), inset 0 5px 0 rgba(255,255,255,.35), 0 5px 0 var(--shelf-edge);
  transition:transform .08s ease, box-shadow .08s ease;
}
.btn:focus-visible{ outline:4px solid #fff; outline-offset:3px; }
.btn[hidden]{ display:none; }
.btn.pressed{ transform:translateY(4px); box-shadow:inset 0 -3px 0 var(--btn-edge), inset 0 3px 0 rgba(255,255,255,.3), 0 1px 0 var(--shelf-edge); }
.btn.shake{ animation:shake .35s ease; }
@keyframes shake{ 20%{transform:translateX(-6px)} 40%{transform:translateX(6px)} 60%{transform:translateX(-4px)} 80%{transform:translateX(3px)} }
#bAdd{ background:var(--b1); } #bRemove{ background:var(--b6); } #bHorn{ background:var(--b2); }
#bLight{ background:var(--b4); } #bSpeed{ background:var(--b3); } #bSky{ background:var(--b5); } #bCam{ background:#ff5d8f; }
.plus{
  position:absolute; top:-2px; right:-2px; width:36%; height:36%; border-radius:50%;
  background:#fff; color:var(--b1); font-weight:900; font-size:clamp(15px,4vw,24px);
  display:grid; place-items:center; box-shadow:0 2px 0 rgba(0,0,0,.25);
}
.plus.minus{ color:var(--b6); }
.tl{ width:38%; height:74%; background:#262626; border-radius:12px; display:flex; flex-direction:column; justify-content:space-evenly; align-items:center; box-shadow:0 2px 0 rgba(0,0,0,.3); }
.tl i{ display:block; width:68%; aspect-ratio:1; border-radius:50%; background:#4a2020; transition:background .15s, box-shadow .15s; }
.tl i.g{ background:#1f3d24; }
.tl.stop i.r{ background:#ff3b3b; box-shadow:0 0 10px #ff5a5a; }
.tl.go i.g{ background:#3ee06a; box-shadow:0 0 10px #5dff88; }
#parent{ position:absolute; top:6px; right:6px; display:flex; gap:6px; z-index:2; }
.pbtn{
  width:36px; height:36px; border-radius:10px; border:none; cursor:pointer; padding:0;
  background:rgba(255,255,255,.5); font-size:18px; opacity:.55; display:grid; place-items:center;
}
.pbtn:focus-visible{ outline:3px solid #fff; opacity:1; }
.pbtn.hold{ opacity:1; transform:scale(1.25); transition:opacity .2s, transform 1.2s linear; }
.pbtn[hidden]{ display:none; }
#bBed{ width:auto; min-width:36px; padding:0 5px; font-size:14px; }
/* bedtime: the sleepy cover over the whole game (the parent corner stays on top of it) */
#sleep{ position:fixed; inset:0; z-index:1; display:none; opacity:0; transition:opacity 3s ease; overflow:hidden; touch-action:none;
  background:radial-gradient(circle at 50% 44%, rgba(34,46,110,.78), rgba(8,12,40,.94) 75%); }
#sleep.show{ display:block; }
#sleep.on{ opacity:1; }
#sleep .moon{ position:absolute; left:50%; top:44%; font-size:min(30vw,30vh); line-height:1; transform:translate(-50%,-50%);
  animation:sway 7s ease-in-out infinite; filter:drop-shadow(0 0 24px rgba(255,236,160,.55)); }
#sleep .zz{ position:absolute; left:58%; top:30%; font-size:min(10vw,10vh); line-height:1; animation:zz 4.5s ease-in infinite; }
#sleep i{ position:absolute; width:5px; height:5px; border-radius:50%; background:#fff6c8; box-shadow:0 0 6px #fff6c8; animation:tw 3.2s ease-in-out infinite; }
@keyframes tw{ 0%,100%{ opacity:.15 } 50%{ opacity:1 } }
@keyframes zz{ 0%{ transform:translate(0,30px) scale(.6); opacity:0 } 25%{ opacity:1 } 100%{ transform:translate(50px,-70px) scale(1.15); opacity:0 } }
@keyframes sway{ 0%,100%{ transform:translate(-50%,-50%) rotate(-5deg) } 50%{ transform:translate(-50%,-53%) rotate(5deg) } }
</style>

</div>

<script>
(() => {
'use strict';
const $ = id => document.getElementById(id);
const stage = $('stage'), cv = $('c'), ctx = cv.getContext('2d');
const bg = document.createElement('canvas');
let W = 0, H = 0, DPR = 1, U = 1, NOW = 0;

const TAU = Math.PI * 2;
const rand = (a, b) => a + Math.random() * (b - a);
const pick = a => a[Math.floor(Math.random() * a.length)];
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, k) => a + (b - a) * k;
const ease = k => 0.5 - 0.5 * Math.cos(Math.PI * clamp(k, 0, 1));
const angDiff = (a, b) => { let d = (a - b) % TAU; if (d > Math.PI) d -= TAU; if (d < -Math.PI) d += TAU; return d; };
const lerpAng = (a, b, k) => a + angDiff(b, a) * k;
const EF = '"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';
function mulberry(seed){ return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

  const n = parseInt(hex.slice(1), 16); let r = n >> 16, g = n >> 8 & 255, b = n & 255;
  const t = p < 0 ? 0 : 255, a = Math.abs(p);
  r = Math.round((t - r) * a + r); g = Math.round((t - g) * a + g); b = Math.round((t - b) * a + b);
  return `rgb(${r},${g},${b})`;
}
function rr(c, x, y, w, h, r){
  if (w < 0){ x += w; w = -w; } if (h < 0){ y += h; h = -h; }
  r = Math.max(0, Math.min(r, w / 2, h / 2));
  c.beginPath(); c.moveTo(x + r, y);
  c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r);
  c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath();
}
function circle(c, x, y, r){ c.beginPath(); c.arc(x, y, Math.max(0, r), 0, TAU); }

const ENGINE_COLORS = ['#e63946','#3a86ff','#ffbe0b','#2a9d8f','#8338ec','#fb8500','#ff5d8f'];
const WAGON_COLORS = ['#ffadad','#ffd6a5','#fdffb6','#caffbf','#9bf6ff','#a0c4ff','#bdb2ff','#ffc6ff'];
const ANIMALS = ['🐶','🐱','🐻','🐰','🐷','🐸','🐵','🐮','🦁','🐯','🐼','🐨','🐔','🐧','🦊','🐭'];
const FLOWERS = ['🌷','🌼','🌻','🌸','🌺'];
const CAR_COLORS = ['#e63946','#3a86ff','#ffbe0b','#2a9d8f','#fb8500','#8338ec','#f15bb5','#f4f4f4'];
const TOY = ['#e63946','#ffbe0b','#3a86ff','#2a9d8f','#fb8500','#8338ec'];

/* ================= sound ================= */
let AC = null, muted = false, bellMuted = false, noiseBuf = null;
function audio(){
  if (muted) return null;
  try {
    if (!AC){ const C = window.AudioContext || window.webkitAudioContext; if (!C) return null; AC = new C(); }
    if (AC.state === 'suspended') AC.resume();
  } catch (e) { return null; }
  return AC;
}
function noise(a){
  if (!noiseBuf){ noiseBuf = a.createBuffer(1, a.sampleRate, a.sampleRate); const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1; }
  const s = a.createBufferSource(); s.buffer = noiseBuf; return s;
}
function envGain(a, t, peak, att, dec, dest){
  const g = a.createGain();
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(peak, t + att);
  g.gain.exponentialRampToValueAtTime(0.0001, t + att + dec);
  g.connect(dest || a.destination); return g;
}
function tone(freq, type, delay, att, dec, peak, endFreq){
  const a = audio(); if (!a) return;
  const t = a.currentTime + delay, g = envGain(a, t, peak, att, dec);
  const o = a.createOscillator(); o.type = type;
  o.frequency.setValueAtTime(freq, t);
  if (endFreq) o.frequency.exponentialRampToValueAtTime(endFreq, t + att + dec);

}
function sustained(freqs, type, dur, peak, cutoff, delay){
  const a = audio(); if (!a) return;
  const t = a.currentTime + (delay || 0);
  const lp = a.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = cutoff;
  const g = a.createGain();
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(peak, t + 0.03);
  g.gain.setValueAtTime(peak, t + dur - 0.08); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  lp.connect(g); g.connect(a.destination);
  for (const f of freqs){ const o = a.createOscillator(); o.type = type; o.frequency.value = f; o.connect(lp); o.start(t); o.stop(t + dur + 0.02); }
}
function sToot(pitch){
  const a = audio(); if (!a) return;
  const t = a.currentTime;
  const lp = a.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 1500;
  const g = a.createGain(), P = 0.075;
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(P, t + 0.04); g.gain.setValueAtTime(P, t + 0.2);
  g.gain.exponentialRampToValueAtTime(0.0001, t + 0.28);
  g.gain.exponentialRampToValueAtTime(P, t + 0.34); g.gain.setValueAtTime(P, t + 0.72);
  g.gain.exponentialRampToValueAtTime(0.0001, t + 0.98);
  lp.connect(g); g.connect(a.destination);
  [370, 466, 554].forEach(f => {
    f *= pitch;
    const o = a.createOscillator(); o.type = 'sawtooth';
    o.frequency.setValueAtTime(f * 0.94, t); o.frequency.exponentialRampToValueAtTime(f, t + 0.06);
    const v = a.createOscillator(); v.frequency.value = 6;
    const vg = a.createGain(); vg.gain.value = f * 0.006;
    v.connect(vg); vg.connect(o.frequency); o.connect(lp);
    o.start(t); v.start(t); o.stop(t + 1.02); v.stop(t + 1.02);
  });
}
const sPop = () => tone(480, 'sine', 0, 0.01, 0.16, 0.22, 1150);
const sDing = () => { tone(784, 'sine', 0, 0.01, 0.9, 0.14); tone(1568, 'sine', 0, 0.01, 0.4, 0.03); tone(622, 'sine', 0.36, 0.01, 1.1, 0.14); tone(1244, 'sine', 0.36, 0.01, 0.4, 0.03); };
const sBloop = () => tone(420, 'sine', 0, 0.01, 0.28, 0.25, 140);
const sClick = () => tone(900, 'square', 0, 0.004, 0.05, 0.05);
const sNo = () => { tone(220, 'triangle', 0, 0.01, 0.18, 0.2, 180); tone(180, 'triangle', 0.2, 0.01, 0.25, 0.2, 140); };
const sAdd = () => [523, 659, 784, 1047].forEach((f, i) => tone(f, 'triangle', i * 0.08, 0.01, 0.25, 0.15));
const sBye = () => [784, 659, 523, 392].forEach((f, i) => tone(f, 'triangle', i * 0.07, 0.01, 0.22, 0.14));
const sBoing = () => tone(260, 'sine', 0, 0.01, 0.35, 0.25, 700);
const sKnock = () => { tone(170, 'sine', 0, 0.004, 0.12, 0.45, 90); tone(170, 'sine', 0.2, 0.004, 0.12, 0.45, 90); };
const sFast = () => tone(300, 'triangle', 0, 0.01, 0.3, 0.18, 1200);
const sSlow = () => tone(900, 'triangle', 0, 0.01, 0.45, 0.18, 220);
const sNight = () => [784, 659, 523, 392].forEach((f, i) => tone(f, 'sine', i * 0.13, 0.02, 0.6, 0.12));
const sDay = () => [392, 523, 659, 784].forEach((f, i) => tone(f, 'sine', i * 0.1, 0.02, 0.5, 0.12));
const sBeep = () => { tone(520, 'square', 0, 0.01, 0.12, 0.07); tone(520, 'square', 0.2, 0.01, 0.16, 0.07); };
const sHonk = () => sustained([196, 247], 'sawtooth', 0.55, 0.09, 900);
const sPutt = () => { for (let i = 0; i < 7; i++) tone(75, 'square', i * 0.1, 0.005, 0.07, 0.12); };
const sReverse = () => { for (let i = 0; i < 3; i++) sustained([1050], 'square', 0.18, 0.035, 3000, i * 0.36); };
const sHello = () => { tone(660, 'sine', 0, 0.01, 0.2, 0.15); tone(880, 'sine', 0.14, 0.01, 0.3, 0.15); };
const sBlock = () => tone(330, 'triangle', 0, 0.005, 0.16, 0.22, 200);
const sClank = () => { tone(180, 'square', 0, 0.003, 0.08, 0.06); tone(820, 'triangle', 0, 0.003, 0.35, 0.06); };
const sCheer = () => [523, 659, 784, 1047, 784, 1047, 1319].forEach((f, i) => tone(f, 'triangle', i * 0.09, 0.01, 0.3, 0.14));
let bellHi = false;
const sBell = () => { if (bellMuted) return; bellHi = !bellHi; tone(bellHi ? 1320 : 1180, 'sine', 0, 0.004, 0.25, 0.035); };
function sSiren(kind){
  const a = audio(); if (!a) return;
  const t = a.currentTime, o = a.createOscillator(), g = a.createGain(), lp = a.createBiquadFilter();
  o.type = 'triangle'; lp.type = 'lowpass'; lp.frequency.value = 2200;
  if (kind === 'fire'){ for (let i = 0; i < 6; i++) o.frequency.setValueAtTime(i % 2 ? 440 : 587, t + i * 0.45); }
  else if (kind === 'ambulance'){ for (let i = 0; i < 8; i++) o.frequency.setValueAtTime(i % 2 ? 660 : 880, t + i * 0.33); } // quicker two-tone
  else { o.frequency.setValueAtTime(650, t); for (let i = 0; i < 3; i++){ o.frequency.linearRampToValueAtTime(1300, t + i * 0.9 + 0.45); o.frequency.linearRampToValueAtTime(650, t + i * 0.9 + 0.9); } }

  g.gain.setValueAtTime(0.06, t + 2.55); g.gain.exponentialRampToValueAtTime(0.0001, t + 2.7);

function sNoise(type, freq, dur, peak){
  const a = audio(); if (!a) return;
  const t = a.currentTime, s = noise(a), f = a.createBiquadFilter(); f.type = type; f.frequency.value = freq;
  const g = envGain(a, t, peak, 0.04, dur); s.connect(f); f.connect(g); s.start(t); s.stop(t + dur + 0.1);
}
const sRustle = () => sNoise('highpass', 2500, 0.35, 0.12);
const sRumble = () => { sNoise('lowpass', 220, 0.8, 0.45); tone(55, 'sawtooth', 0, 0.05, 0.7, 0.06); };
const sTip = () => sNoise('lowpass', 700, 1.3, 0.18);
const sScoop = () => sNoise('lowpass', 500, 0.5, 0.22);
const sDump = () => sNoise('lowpass', 700, 0.6, 0.16);
const sHum = f => tone(f, 'triangle', 0, 0.01, 0.12, 0.05, f * 1.06);
const sChug = () => tone(70, 'square', 0, 0.004, 0.06, 0.06);
const sBackUp = () => sustained([1050], 'square', 0.2, 0.03, 3000);
const sBonk = () => tone(130, 'sine', 0, 0.005, 0.14, 0.2, 90);
const sPour = () => { sNoise('lowpass', 420, 2.2, 0.2); tone(90, 'sawtooth', 0, 0.1, 1.8, 0.04, 70); };
const sSpray = () => sNoise('highpass', 1800, 1.6, 0.09);
const sBubbles = () => { for (let i = 0; i < 7; i++){ const f = rand(700, 1500); tone(f, 'sine', i * 0.07 + rand(0, 0.03), 0.005, 0.08, 0.06, f * 1.5); } };
// the robber: a tiptoeing tune when he turns up, a cheeky giggle, the police car's "whoop" when it catches him,
// the coins flying out of his bag and a car door shutting

function inStation(st, x, y, pad, bay){
  const dx = x - st.x, dy = y - st.y, ca = Math.cos(st.a), sa = Math.sin(st.a), lx = dx * ca + dy * sa, ly = -dx * sa + dy * ca;
  return Math.abs(lx) < STN_W / 2 * U + pad && ly < STN_D / 2 * U + pad && ly > -(STN_D / 2 + (bay ? STN_FRONT - ROAD_HALF : 0)) * U - pad;
}
// is there open grass here, clear of everything that's been built so far?
function groundFree(x, y, r){
  if (x < r + 4 || y < r + 4 || x > W - r - 4 || y > H - r - 4) return false;
  if (minD2(x, y) < (r + 18 * U) ** 2) return false;
  if (pMinD2(ROAD, x, y, 3) < ((ROAD_HALF + 4) * U + r) ** 2) return false;
  if (spur) for (const P of [spur.CE, spur.CX, spur.SI, spur.SO]) if (pMinD2(P, x, y, 2) < ((ROAD_HALF + 6) * U + r) ** 2) return false;
  if (siteDist(x, y) < r + 8 * U) return false;
  if (pond && ((x - pond.x) / (pond.rx + r + 12 * U)) ** 2 + ((y - pond.y) / (pond.ry + r + 12 * U)) ** 2 < 1) return false;
  if (Math.hypot(x - station.cx, y - station.cy) < r + 62 * U) return false;
  if (Math.hypot(x - tunnel.cx, y - tunnel.cy) < r + 64 * U) return false;
  if (works){ const wc = works.toW(0, (ROAD_HALF + 20) * U); if (Math.hypot(x - wc.x, y - wc.y) < r + 88 * U) return false; }
  if (nearWash(x, y, r) || nearSide(x, y, r) || (bank && Math.hypot(x - bank.x, y - bank.y) < r + 40 * U)) return false;
  if (stations.some(st => inStation(st, x, y, r + 5 * U, true))) return false;
  if (x > W - 230 && y < 60 + r) return false; // the parent corner (5 buttons in the home-screen app)
  return true;
}
// Places on the grass beside the inner lane where something can happen (the bonfire, the scooter), with room at the
// kerb just before them for the fire engine or the ambulance to pull up.
function buildSpots(){
  spots = [];
  const L1 = LANES[1], L = L1.L, kerb = (s, d) => { const q = pAt(L1, wrap(s, L)); return { x: q.x + Math.sin(q.a) * d * U, y: q.y - Math.cos(q.a) * d * U, a: q.a }; };
  for (let s = 0; s < L; s += 20 * U){
    const q = kerb(s, 27);
    if ([-95, -50, 30].some(d => Math.abs(angDiff(kerb(s + d * U, 0).a, q.a)) > 0.1)) continue; // (near enough straight)
    if (!groundFree(q.x, q.y, 13 * U)) continue;
    let ok = true;
    for (let d = -104; d <= -24 && ok; d += 16){
      const b = kerb(s + d * U, BAY);
      ok = b.x > 14 * U && b.y > 14 * U && b.x < W - 14 * U && b.y < H - 14 * U && minD2(b.x, b.y) > (32 * U) ** 2 && pullOkAt(b.x, b.y, 27) && !(b.x > W - 230 && b.y < 70);
    }
    if (!ok || spots.some(o => Math.min(wrap(o.s - s, L), wrap(s - o.s, L)) < 170 * U)) continue;
    spots.push({ s, x: q.x, y: q.y, busy: null });
  }
}
function buildScenery(){
  const R = mulberry(7);
  trees = []; houses = []; flies = [];
  const placed = [];
  const ok = (x, y, r) => {
    if (!groundFree(x, y, r)) return false;
    if (spots.some(sp => Math.hypot(x - sp.x, y - sp.y) < r + 22 * U)) return false; // (and nothing in the fire engine's way)
    for (const p of placed) if (Math.hypot(x - p.x, y - p.y) < r + p.r + 6 * U) return false;
    return true;
  };
  const area = W * H / (U * U);
  const ROOFS = ['#d64545', '#2d6cdf', '#f08c2b', '#7b4fd6', '#2a9d8f'];
  const nHouses = clamp(Math.round(area / 150000), 1, 5);
  for (let i = 0, tries = 0; i < nHouses && tries < 900; tries++){
    const x = R() * W, y = R() * H, r = 20 * U;
    if (ok(x, y, r)){ houses.push({ x, y, r, rot: (R() - 0.5) * 0.6, roof: ROOFS[Math.floor(R() * ROOFS.length)] }); placed.push({ x, y, r }); i++; }
  }
  const DARK = ['#2f7d32', '#3b8f3a', '#2c6e49', '#468a2c'];
  const nTrees = clamp(Math.round(area / 14000), 10, 44);
  for (let i = 0, tries = 0; i < nTrees && tries < 3000; tries++){
    const r = (9 + R() * 12) * U, x = R() * W, y = R() * H;
    if (ok(x, y, r)){ trees.push({ x, y, r, dark: DARK[Math.floor(R() * DARK.length)], apples: R() < 0.35, wig: 0 }); placed.push({ x, y, r }); i++; }
  }
  for (let i = 0; i < 18; i++) flies.push({ x: MX0 + R() * (MX1 - MX0), y: MY0 + R() * (MY1 - MY0), ph: R() * TAU, sp: 0.3 + R() * 0.6 });
}

/* ================= background ================= */
function pathTrack(c){ c.beginPath(); c.moveTo(TX[0], TY[0]); for (let i = 1; i < TN; i++) c.lineTo(TX[i], TY[i]); c.closePath(); }
function siteFrame(c){ c.translate(site.p.x, site.p.y); c.rotate(site.theta); }
// flat3: drawing the 3D view's ground, which leaves off what stands up (the 3D view has models of those)
let flat3 = false;
function drawBG(cnv = bg, sc = DPR, for3d = false){
  cnv.width = Math.round(W * sc); cnv.height = Math.round(H * sc);
  const c = cnv.getContext('2d'); c.setTransform(sc, 0, 0, sc, 0, 0);
  flat3 = for3d;
  const R = mulberry(3);
  c.fillStyle = '#8acb68'; c.fillRect(0, 0, W, H);
  for (let i = 0; i < 26; i++){
    c.fillStyle = R() < 0.5 ? 'rgba(255,255,255,0.07)' : 'rgba(40,100,20,0.07)';
    c.beginPath(); c.ellipse(R() * W, R() * H, (40 + R() * 130) * U, (30 + R() * 80) * U, R() * 3, 0, TAU); c.fill();
  }
  c.strokeStyle = 'rgba(48,112,30,0.35)'; c.lineWidth = 1.5 * U; c.lineCap = 'round';
  const nBl = Math.round(W * H / 700);
  for (let i = 0; i < nBl; i++){ const x = R() * W, y = R() * H; c.beginPath(); c.moveTo(x, y); c.lineTo(x + (R() - 0.5) * 3 * U, y - 4 * U); c.stroke(); }

  // road loop
  c.lineJoin = 'round'; c.lineCap = 'butt';
  c.save(); c.translate(2 * U, 3 * U); c.strokeStyle = 'rgba(0,0,0,0.15)'; c.lineWidth = (ROAD_HALF * 2 + 4) * U; strokePath(c, ROAD); c.restore();
  c.strokeStyle = '#d7d2c8'; c.lineWidth = (ROAD_HALF * 2 + 5) * U; strokePath(c, ROAD);
  c.strokeStyle = '#6e737b'; c.lineWidth = ROAD_HALF * 2 * U; strokePath(c, ROAD);
  c.save(); c.setLineDash([10 * U, 10 * U]); c.strokeStyle = 'rgba(255,255,255,0.85)'; c.lineWidth = 2 * U; strokePath(c, ROAD); c.restore();
  for (const jn of sides) drawSideRoad(c, jn);

  if (spur){
    // spur tarmac from the loop to the site gate, with curved junction corners
    c.strokeStyle = '#6e737b'; c.lineWidth = (LANE * 2 + 3) * U; strokePath(c, spur.CE); strokePath(c, spur.CX);
    c.save(); siteFrame(c);
    const rr0 = Math.min(spur.rIn, spur.rOut) - (LANE + 1) * U;
    c.fillStyle = '#6e737b'; c.fillRect(-rr0, -ROAD_HALF * U, rr0 + site.u0 + 2 * U, ROAD_HALF * 2 * U);
    c.strokeStyle = '#fff'; c.lineWidth = 3 * U;
    c.beginPath(); c.moveTo(-(BAR_R + 3) * U, 0); c.lineTo(-(BAR_R + 3) * U, -ROAD_HALF * U); c.stroke();
    c.beginPath(); c.moveTo((BAR_R + 3) * U, 0); c.lineTo((BAR_R + 3) * U, ROAD_HALF * U); c.stroke();
    c.setLineDash([4 * U, 4 * U]); c.lineWidth = 2 * U;
    c.beginPath(); c.moveTo(-rr0 + 2 * U, 0); c.lineTo(-rr0 + 2 * U, ROAD_HALF * U); c.stroke();
    c.setLineDash([]);
    c.restore();
  }
  if (site) drawSiteBG(c, R);

  if (pond){
    const { x, y, rx, ry } = pond;
    c.fillStyle = '#6fb454'; c.beginPath(); c.ellipse(x, y + 3 * U, rx + 8 * U, ry + 8 * U, 0, 0, TAU); c.fill();
    c.fillStyle = '#3fa3dd'; c.beginPath(); c.ellipse(x, y, rx, ry, 0, 0, TAU); c.fill();
    c.fillStyle = '#6cc3ef'; c.beginPath(); c.ellipse(x - rx * 0.12, y - ry * 0.14, rx * 0.72, ry * 0.62, 0, 0, TAU); c.fill();
    c.strokeStyle = 'rgba(255,255,255,0.5)'; c.lineWidth = 2 * U;
    c.beginPath(); c.ellipse(x - rx * 0.35, y - ry * 0.4, rx * 0.25, ry * 0.12, -0.2, Math.PI * 1.1, Math.PI * 1.8); c.stroke();
    [[0.55, 0.3, 11], [-0.6, 0.35, 9], [0.3, -0.55, 8]].forEach(([ox, oy, r]) => {
      const lx = x + ox * rx, ly = y + oy * ry;
      c.fillStyle = '#3f9a3a'; c.beginPath(); c.moveTo(lx, ly); c.arc(lx, ly, r * U, 0.4, TAU - 0.1); c.closePath(); c.fill();
    });
  }
  if (!flat3) for (const h of houses){
    c.save(); c.translate(h.x, h.y); c.rotate(h.rot);
    const w = h.r * 2, d = h.r * 1.6;
    c.fillStyle = 'rgba(0,0,0,0.18)'; rr(c, -w / 2 + 3 * U, -d / 2 + 4 * U, w, d, 3 * U); c.fill();
    c.fillStyle = h.roof; rr(c, -w / 2, -d / 2, w, d / 2, 2 * U); c.fill();
    c.fillStyle = shade(h.roof, -0.28); rr(c, -w / 2, 0, w, d / 2, 2 * U); c.fill();
    c.strokeStyle = shade(h.roof, 0.35); c.lineWidth = 2 * U; c.beginPath(); c.moveTo(-w / 2 + 2 * U, 0); c.lineTo(w / 2 - 2 * U, 0); c.stroke();
    c.fillStyle = '#7a5a48'; c.fillRect(w * 0.18, -d * 0.36, 7 * U, 7 * U);
    c.fillStyle = '#f4e3c3'; c.fillRect(-4 * U, d / 2, 8 * U, 3 * U);
    c.restore();
  }
  for (const st of stations){ drawStationGround(c, st); if (!flat3) drawStation(c, st); }
  if (bank && !flat3) drawBank(c);
  if (works && works.ph > 0){
    c.save(); c.translate(works.x, works.y); c.rotate(works.a);
    c.fillStyle = '#3b3e44'; rr(c, -50 * U, (ROAD_HALF + 9) * U, 100 * U, works.ph, 3 * U); c.fill();
    c.fillStyle = '#8b5a2b'; circle(c, 58 * U, (ROAD_HALF + 9) * U + works.ph / 2, Math.min(9 * U, works.ph / 2)); c.fill();
    c.restore();
  }
  // wooden track
  c.save(); c.translate(2 * U, 3.5 * U); pathTrack(c); c.strokeStyle = 'rgba(0,0,0,0.17)'; c.lineWidth = 31 * U; c.stroke(); c.restore();
  pathTrack(c);
  c.strokeStyle = '#dcab70'; c.lineWidth = 28 * U; c.stroke();
  c.strokeStyle = '#a66f38'; c.lineWidth = 17 * U; c.stroke();
  c.strokeStyle = '#e5b981'; c.lineWidth = 9 * U; c.stroke();
  const pieces = Math.max(8, Math.round(TL / (92 * U)));
  c.strokeStyle = 'rgba(110,62,24,0.55)'; c.lineWidth = 1.6 * U;
  for (let k = 0; k < pieces; k++){
    const p = at(k * TL / pieces), nx = -Math.sin(p.a), ny = Math.cos(p.a);
    c.beginPath(); c.moveTo(p.x + nx * 14 * U, p.y + ny * 14 * U); c.lineTo(p.x - nx * 14 * U, p.y - ny * 14 * U); c.stroke();
  }
  if (spur){
    c.save(); c.translate(spur.p.x, spur.p.y); c.rotate(spur.p.a);
    c.fillStyle = '#6e737b'; c.fillRect(-ROAD_HALF * U, -15 * U, ROAD_HALF * 2 * U, 30 * U);
    c.fillStyle = 'rgba(255,255,255,0.9)';
    for (let k = -3; k <= 3; k++){ c.fillRect((k * 5 - 1) * U, -15 * U, 2 * U, 3 * U); c.fillRect((k * 5 - 1) * U, 12 * U, 2 * U, 3 * U); }
    c.strokeStyle = '#2e2e33'; c.lineWidth = 3 * U;
    for (const y of [-6.5, 6.5]){ c.beginPath(); c.moveTo(-ROAD_HALF * U, y * U); c.lineTo(ROAD_HALF * U, y * U); c.stroke(); }
    c.restore();
  }
  drawWashBG(c);
  if (flat3){ flat3 = false; return; }
  // station
  c.save(); c.translate(station.cx, station.cy); c.rotate(station.a);
  c.fillStyle = 'rgba(0,0,0,0.16)'; rr(c, -44 * U, -8 * U, 92 * U, 24 * U, 3 * U); c.fill();
  c.fillStyle = '#d9d0c1'; rr(c, -46 * U, -11 * U, 92 * U, 24 * U, 3 * U); c.fill();
  c.fillStyle = '#ffd23f'; c.fillRect(-46 * U, -11 * U, 92 * U, 3 * U);
  c.fillStyle = 'rgba(0,0,0,0.2)'; rr(c, -22 * U, 0, 48 * U, 15 * U, 3 * U); c.fill();
  c.fillStyle = '#d64545'; rr(c, -24 * U, -3 * U, 48 * U, 15 * U, 3 * U); c.fill();
  c.fillStyle = '#f2f2f2';
  for (let k = 0; k < 4; k++) c.fillRect((-21 + k * 12) * U, -3 * U, 6 * U, 15 * U);
  c.fillStyle = '#2d6cdf'; rr(c, 30 * U, 1 * U, 12 * U, 8 * U, 2 * U); c.fill();
  for (const lx of [-40, 40]){ c.fillStyle = '#333'; circle(c, lx * U, 6 * U, 3.2 * U); c.fill(); c.fillStyle = '#ffe9a8'; circle(c, lx * U, 6 * U, 1.8 * U); c.fill(); }
  c.restore();
}
// a side road running off the edge of the map, with rounded kerbs where it meets the loop (local frame: x = t, y = -n)
function drawSideRoad(c, jn){
  const h = ROAD_HALF * U, far = jn.off * U, fr = 12 * U;
  const shape = (e, n0) => {
    const r = fr - e;
    c.beginPath(); c.moveTo(-h - fr, -n0); c.lineTo(-h - fr, -(h + e));
    c.arc(-h - fr, -(h + fr), r, Math.PI / 2, 0, true);
    c.lineTo(-h - e, -far); c.lineTo(h + e, -far); c.lineTo(h + e, -(h + fr));
    c.arc(h + fr, -(h + fr), r, Math.PI, Math.PI / 2, true);
    c.lineTo(h + fr, -n0); c.closePath();
  };
  const frame = (dx, dy) => { c.save(); c.translate(jn.x + dx, jn.y + dy); c.rotate(jn.a); };
  frame(2 * U, 3 * U); c.fillStyle = 'rgba(0,0,0,0.15)'; shape(2.5 * U, h + 2.5 * U); c.fill(); c.restore();
  frame(0, 0);
  c.fillStyle = '#d7d2c8'; shape(2.5 * U, h - 2 * U); c.fill();
  c.fillStyle = '#6e737b'; shape(0, h - 2 * U); c.fill();
  c.strokeStyle = 'rgba(255,255,255,0.85)'; c.lineWidth = 2 * U;
  c.save(); c.setLineDash([10 * U, 10 * U]); c.beginPath(); c.moveTo(0, -(h + 8 * U)); c.lineTo(0, -far); c.stroke(); c.restore();
  // give way: a double broken line across the way in
  c.save(); c.setLineDash([4 * U, 3 * U]); c.lineWidth = 1.8 * U;
  for (const n of [h + 2 * U, h + 5.5 * U]){ c.beginPath(); c.moveTo(1 * U, -n); c.lineTo(h - 1 * U, -n); c.stroke(); }
  c.restore();
  c.restore();
}
// the bank, from above: a big slate roof, and a white stone porch with columns and steps along its front (towards
// the road, -y here) with a gold coin over the door; an alarm bell on the corner (lit by drawBankAlarm)
function drawBank(c){
  const w = BANK_W * U, d = BANK_D * U, pd = 12 * U, y0 = -d / 2 + pd; // pd: the porch's depth
  c.save(); c.translate(bank.x, bank.y); c.rotate(bank.a);
  c.fillStyle = 'rgba(0,0,0,0.18)'; rr(c, -w / 2 + 3 * U, -d / 2 + 4 * U, w, d, 3 * U); c.fill();
  // roof: two slopes and a ridge
  c.fillStyle = '#7d8aa3'; rr(c, -w / 2, y0, w, (d - pd) / 2, 2 * U); c.fill();
  c.fillStyle = '#5c6880'; rr(c, -w / 2, y0 + (d - pd) / 2, w, (d - pd) / 2, 2 * U); c.fill();
  c.strokeStyle = '#a9b4c8'; c.lineWidth = 2 * U; c.beginPath(); c.moveTo(-w / 2 + 2 * U, y0 + (d - pd) / 2); c.lineTo(w / 2 - 2 * U, y0 + (d - pd) / 2); c.stroke();
  // porch: steps, floor, columns
  c.fillStyle = '#e9e3d4'; rr(c, -w / 2 + 4 * U, -d / 2 - 5 * U, w - 8 * U, 7 * U, 2 * U); c.fill();
  c.strokeStyle = 'rgba(120,100,70,0.25)'; c.lineWidth = 1 * U;
  for (const y of [-d / 2 - 2.8 * U, -d / 2 - 0.6 * U]){ c.beginPath(); c.moveTo(-w / 2 + 5 * U, y); c.lineTo(w / 2 - 5 * U, y); c.stroke(); }
  c.fillStyle = '#f4efe3'; rr(c, -w / 2 + 1 * U, -d / 2, w - 2 * U, pd + 1 * U, 2 * U); c.fill();
  for (let i = 0; i < 6; i++){
    const x = -w / 2 + 6 * U + i * (w - 12 * U) / 5;
    c.fillStyle = 'rgba(0,0,0,0.15)'; circle(c, x + 0.8 * U, -d / 2 + 2.6 * U, 2.6 * U); c.fill();
    c.fillStyle = '#ffffff'; circle(c, x, -d / 2 + 1.9 * U, 2.6 * U); c.fill();
  }
  c.fillStyle = '#7a5a48'; rr(c, -5 * U, y0 - 2 * U, 10 * U, 3 * U, 1 * U); c.fill(); // the door
  // the gold coin, on the roof over the door
  const cy = y0 + 9 * U;
  c.fillStyle = '#c99a00'; circle(c, 0, cy, 8.5 * U); c.fill();
  c.fillStyle = '#ffd23f'; circle(c, 0, cy, 7 * U); c.fill();
  c.strokeStyle = '#e0a800'; c.lineWidth = 1.4 * U; circle(c, 0, cy, 4.6 * U); c.stroke();
  c.strokeStyle = 'rgba(255,255,255,0.7)'; c.lineWidth = 1.2 * U; c.beginPath(); c.arc(0, cy, 5.8 * U, Math.PI * 1.1, Math.PI * 1.5); c.stroke();
  c.restore();
}
/* ---------- the stations, drawn ---------- */
// the paved bay from the kerb to the front of a station, marked out in its colour (part of the ground: in 3D too)
function drawStationGround(c, st){
  const w = STN_W * U, d = STN_D * U, y1 = -d / 2, y0 = y1 - (STN_FRONT - ROAD_HALF - 1) * U, by = y1 - (STN_FRONT - LANE - BAY) * U;
  c.save(); c.translate(st.x, st.y); c.rotate(st.a);
  c.fillStyle = '#c9ccd1'; rr(c, -w / 2 - 5 * U, y0, w + 10 * U, y1 - y0 + 3 * U, 4 * U); c.fill();
  c.strokeStyle = STN_COL[st.kind]; c.lineWidth = 1.8 * U; c.setLineDash([6 * U, 4 * U]);
  rr(c, -w / 2 - 1 * U, by - 12.5 * U, w + 2 * U, 25 * U, 4 * U); c.stroke(); c.setLineDash([]);
  c.restore();
}
function drawStation(c, st){
  const w = STN_W * U, d = STN_D * U, kind = st.kind, bw = kind === 'police' ? w - 17 * U : w, x0 = -w / 2, xm = x0 + bw / 2;
  const [hi, lo, ridge, door] = { fire: ['#d94141', '#b52f2f', '#f29a9a', '#f1f1f1'], police: ['#3b6fc4', '#2b559c', '#9dbcf0', '#1d3a6e'], ambulance: ['#f6f8fa', '#dde3e9', '#ffffff', '#1f9e4a'] }[kind];
  c.save(); c.translate(st.x, st.y); c.rotate(st.a);
  c.fillStyle = 'rgba(0,0,0,0.18)'; rr(c, x0 + 3 * U, -d / 2 + 4 * U, bw, d, 3 * U); c.fill();
  // the doors, along the front (a strip, seen from above)
  c.fillStyle = door;
  if (kind === 'fire') for (const x of [-20.5, 1.5]){ rr(c, x * U, -d / 2 - 2.5 * U, 19 * U, 5 * U, 1 * U); c.fill(); }
  else rr(c, xm - (kind === 'police' ? 5 : 11) * U, -d / 2 - 2.5 * U, (kind === 'police' ? 10 : 22) * U, 5 * U, 1 * U), c.fill();
  // roof: two slopes and a ridge
  c.fillStyle = hi; rr(c, x0, -d / 2, bw, d / 2 + 1, 2 * U); c.fill();
  c.fillStyle = lo; rr(c, x0, 0, bw, d / 2, 2 * U); c.fill();
  c.strokeStyle = ridge; c.lineWidth = 2 * U; c.beginPath(); c.moveTo(x0 + 2 * U, 0); c.lineTo(x0 + bw - 2 * U, 0); c.stroke();
  if (kind === 'fire'){
    // the hose tower at the back, and a flame on the roof
    c.fillStyle = 'rgba(0,0,0,0.2)'; rr(c, w / 2 - 14 * U, d / 2 - 13 * U, 12 * U, 12 * U, 2 * U); c.fill();
    c.fillStyle = '#8f2424'; rr(c, w / 2 - 15.5 * U, d / 2 - 15 * U, 12 * U, 12 * U, 2 * U); c.fill();
    c.fillStyle = '#f4f4f4'; rr(c, w / 2 - 13 * U, d / 2 - 12.5 * U, 7 * U, 7 * U, 1.5 * U); c.fill();
    c.fillStyle = '#ffffff'; circle(c, -7 * U, 0, 9 * U); c.fill();
    c.strokeStyle = '#ffd23f'; c.lineWidth = 1.6 * U; circle(c, -7 * U, 0, 9 * U); c.stroke();
    c.save(); c.translate(-7 * U, 0); c.rotate(-st.a); c.textAlign = 'center'; c.textBaseline = 'middle';
    c.fillStyle = '#000'; c.font = `${Math.round(12 * U)}px ${EF}`; c.fillText('🔥', 0, 0.5 * U); c.restore();
  } else if (kind === 'police'){
    // a gold star on the roof, and the pen at the side
    c.fillStyle = '#ffffff'; circle(c, xm, 0, 9 * U); c.fill();

function makeTrain(){
  const used = new Set(trains.map(t => t.color));
  const color = pick(ENGINE_COLORS.filter(c => !used.has(c))) || pick(ENGINE_COLORS);
  const nW = 1 + Math.floor(Math.random() * 3);

  for (let i = 0; i < nW; i++) cars.push({ e: 0, len: 48, color: pick(WAGON_COLORS), animal: pick(ANIMALS), jump: 0 });
  const lenU = cars.reduce((a, c) => a + c.len, 0) + (cars.length - 1) * GAP;
  return { color, cars, lenU, head: 0, v: 0, pause: 0, cool: 0, drag: 0, dragV: 0, bounce: 0, pitch: rand(0.82, 1.22), smokeT: 0, geo: [] };
}
function addTrain(){
  if (trains.length >= 7) return null;
  const nt = makeTrain(), L = trainLen(nt), m = 34 * U;
  if (!trains.length){ nt.head = mod(station.s - 80 * U); trains.push(nt); computeGeo(nt); return nt; }
  const s = [...trains].sort((a, b) => mod(a.head) - mod(b.head));
  let best = -1, bestHead = 0;
  for (let i = 0; i < s.length; i++){
    const B = s[i], A = s[(i + 1) % s.length];
    const d = s.length === 1 ? TL : mod(A.head - B.head);
    const free = d - trainLen(A), spare = free - L - 2 * m;
    if (spare > best){ best = spare; bestHead = B.head + free / 2 + L / 2; }
  }
  if (best < 0) return null;
  nt.head = mod(bestHead); trains.push(nt); computeGeo(nt); return nt;
}
function computeGeo(tr){
  let off = 0; tr.geo.length = 0;
  for (const car of tr.cars){
    const len = car.len * U, f = tr.head - off, b = f - len, P = at(f), Q = at(b);
    tr.geo.push({ x: (P.x + Q.x) / 2, y: (P.y + Q.y) / 2, a: Math.atan2(P.y - Q.y, P.x - Q.x), f, b, len, car });
    off += len + GAP * U;
  }
}
function pushFrom(tr, delta){
  if (trains.length < 2 || !delta) return;
  const s = [...trains].sort((a, b) => mod(a.head) - mod(b.head)), n = s.length, i0 = s.indexOf(tr), m = 10 * U;
  let P = tr;
  for (let k = 1; k < n; k++){
    if (delta > 0){
      const A = s[(i0 + k) % n]; if (A.drag) break;
      const need = trainLen(A) + m;
      if (mod(A.head - P.head) < need){ A.head = mod(P.head + need); A.dragV = Math.max(A.dragV, tr.dragV); } else break;
      P = A;
    } else {
      const B = s[(i0 - k + n) % n]; if (B.drag) break;
      const need = trainLen(P) + m;
      if (mod(P.head - B.head) < need){ B.head = mod(P.head - need); B.dragV = Math.max(B.dragV, tr.dragV); } else break;
      P = B;
    }
  }
}

function updateWorks(dt){
  if (!works || works.ph < 14 * U) return;
  works.bounce = Math.max(0, works.bounce - dt);
  if (works.rpause > 0){ works.rpause -= dt; return; }
  works.roller += works.rdir * 12 * U * dt * (going ? 1 : 0);
  const lim = 38 * U;

const drags = new Map();
const duck = { x: -999, y: -999, flap: 0 };
function localPt(e){ const r = cv.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; }
function hitTrain(x, y){
  const pad = Math.max(12 * U, 10), hw = WID * U / 2 + pad;
  let best = null, bd = 1e18;
  for (const tr of trains) for (let k = 0; k < tr.geo.length; k++){
    const g = tr.geo[k], dx = x - g.x, dy = y - g.y, ca = Math.cos(-g.a), sa = Math.sin(-g.a);
    const lx = dx * ca - dy * sa, ly = dx * sa + dy * ca;
    if (Math.abs(lx) < g.len / 2 + pad && Math.abs(ly) < hw){ const d = dx * dx + dy * dy; if (d < bd){ bd = d; best = { tr, k }; } }
  }
  return best;
}
function hitVehicle(x, y){
  const pad = Math.max(8 * U, 8);
  let best = null, bd = 1e18;
  for (const v of vehicles){
    const T = VT[v.type], dx = x - v.x, dy = y - v.y, ca = Math.cos(-v.a), sa = Math.sin(-v.a);
    const lx = dx * ca - dy * sa, ly = dx * sa + dy * ca;
    if (Math.abs(lx) < T.len * U / 2 + pad && Math.abs(ly) < T.wid * U / 2 + pad){ const d = dx * dx + dy * dy; if (d < bd){ bd = d; best = v; } }
  }
  return best;
}
// site machines he can drive: the bulldozer, the digger (body or bucket) and the crane (hook or mast)
function hitMachine(x, y){
  if (!site) return null;
  const q = site.fromW(x, y), pad = Math.max(6 * U, 6);
  if (dozer){
    const c = Math.cos(dozer.a), s = Math.sin(dozer.a), du = q.u - dozer.u, dw = q.w - dozer.w;
    if (Math.abs(du * c + dw * s) < 21 * U + pad && Math.abs(-du * s + dw * c) < 15 * U + pad) return dozer;
  }
  if (ex){ const b = exBucket(); if (Math.hypot(q.u - ex.u, q.w - ex.w) < 24 * U || Math.hypot(q.u - b.u, q.w - b.w) < 12 * U) return ex; }
  if (crane){ const h = craneHook(); if (Math.hypot(q.u - h.u, q.w - h.w) < 16 * U || Math.hypot(q.u - crane.cu, q.w - crane.cw) < 14 * U) return crane; }
  return null;
}
function hitSign(x, y){
  for (const sg of signs){ const q = site.toW(sg.u, sg.w); if (Math.hypot(x - q.x, y - q.y) < Math.max((SIGN_R + 5) * U, 22)) return sg; }
  return null;
}
function pressSign(sg){
  sg.bounce = 0.5; sClick();
  const q = site.toW(sg.u, sg.w);
  if (sg.kind === 'crane'){
    if (!crane){ sg.shake = 0.4; sNo(); return; }
    crane.boost = 12; sClank(); sparkle(q.x, q.y, 12);
    if (build.done) sCheer();
    return;
  }
  if (sg.kind === 'col'){
    // any colour, then each colour in turn; a block already on the hook changes colour too
    build.pick = build.pick >= TOY.length - 1 ? -1 : build.pick + 1;
    sColour(build.pick); sparkle(q.x, q.y, 10);
    if (crane && crane.carry) crane.col = nextCol();
    return;
  }
  const here = vehicles.find(v => v.waiting > 0 && v.type === signType(sg.kind));
  if (here){ sendOff(here); here.bounce = 0.5; sparkle(here.x, here.y, 16); sparkle(q.x, q.y, 10); return; } // the big "go" button
  const v = callTruck(signType(sg.kind));
  if (!v){ sg.bounce = 0; sg.shake = 0.4; sNo(); return; }
  sHonk(); v.bounce = 0.5; sparkle(v.x, v.y, 12); sparkle(q.x, q.y, 10);
}
function grabMachine(m){
  m.held++;
  if (m === crane){ m.last = null; sClank(); }
  else sRumble();
}
function tapMachine(m, x, y){
  if (m === crane){ crane.boost = 5; sClank(); }
  else if (m === ex){ ex.boost = 5; sRumble(); }
  else if (m === dozer){ dozer.bounce = 0.5; sRumble(); }

}
cv.addEventListener('pointerdown', e => {
  e.preventDefault(); if (bed.asleep) return; audio();
  const p = localPt(e), hit = hitTrain(p.x, p.y);
  if (hit){
    try { cv.setPointerCapture(e.pointerId); } catch (_) {}
    const tr = hit.tr, near = nearestS(p.x, p.y, tr.head, TL * 0.3);
    V3.cam.pick = tr; // 🎥 rides with the train he last touched
    drags.set(e.pointerId, { tr, k: hit.k, off: tr.head - near, sx: p.x, sy: p.y, moved: false, lastT: performance.now() });
    tr.drag++; tr.pause = 0;
    return;
  }
  const sg = site && hitSign(p.x, p.y);
  if (sg){ pressSign(sg); return; }
  const m = hitMachine(p.x, p.y);

cv.addEventListener('pointermove', e => {
  if (bed.asleep) return;
  const d = drags.get(e.pointerId); if (!d) return;
  const p = localPt(e);
  if (!d.moved && Math.hypot(p.x - d.sx, p.y - d.sy) > 9){ d.moved = true; if (d.m) grabMachine(d.m); }
  if (!d.moved) return;
  if (d.m){ if (site){ const q = site.fromW(p.x, p.y); d.m.tu = q.u; d.m.tw = q.w; } return; }
  const tr = d.tr, n = nearestS(p.x, p.y, tr.head - d.off, TL * 0.15);
  const newHead = n + d.off, delta = newHead - tr.head;
  const now = performance.now(), dt = Math.max(0.008, (now - d.lastT) / 1000); d.lastT = now;
  tr.dragV = Math.max(tr.dragV, Math.min(260 * U, Math.abs(delta) / dt));
  tr.head = mod(newHead);
  pushFrom(tr, delta);
});
function endDrag(e){
  const d = drags.get(e.pointerId); if (!d) return;
  drags.delete(e.pointerId);
  if (d.m){
    if (!d.moved) tapMachine(d.m, d.sx, d.sy);

    return;
  }
  d.tr.drag = Math.max(0, d.tr.drag - 1);

    const car = d.tr.cars[d.k];

    else { car.jump = 0.7; sBoing(); const g = d.tr.geo[d.k]; if (g) emoji(g.x, g.y - 10 * U, '❤️', 2, 18); }
  }
}
cv.addEventListener('pointerup', endDrag);

cv.addEventListener('contextmenu', e => e.preventDefault());

function tapScene(x, y){
  if (Math.hypot(x - duck.x, y - duck.y) < 26 * U){ sQuack(); duck.flap = 0.6; emoji(duck.x, duck.y - 12 * U, '💦', 2, 16); return; }
  // a wash: bubbles all over whatever's inside
  for (const [w, hl, hw] of [[carWash, 38 * U, (ROAD_HALF + 10) * U], [trainWash, 54 * U, 28 * U]]) if (w && inWash(w, x, y, hl, hw)){
    sSpray(); sBubbles(); w.busy = 1.2;
    for (let i = 0; i < 26; i++){ const t = rand(-1, 1) * hl * 0.8, n = rand(-1, 1) * hw * 0.6; bubbles(w.x + Math.cos(w.a) * t - Math.sin(w.a) * n, w.y + Math.sin(w.a) * t + Math.cos(w.a) * n, 1, 3 * U); }
    for (const v of vehicles) if (inWash(w, v.x, v.y, hl, hw)){ v.shine = 5; v.bounce = 0.5; }
    for (const tr of trains) if (tr.geo.some(g => inWash(w, g.x, g.y, hl, hw))){ tr.shine = 5; tr.bounce = 0.6; }
    return;
  }
  for (const f of rob.figs) if (Math.hypot(x - f.x, y - f.y) < 18 * U){

    rob.fb[f.who] = 0.35; return;
  }
  for (const st of stations){
    for (const f of st.figs) if (f.who !== 'plaster' && Math.hypot(x - f.x, y - f.y) < 18 * U){
      if (f.who === 'robber') sGiggle(); else { sHello(); emoji(f.x, f.y - 16 * U, '👋', 1, 22); }
      return;
    }
    const sp = st.call && st.call.spot;
    if (sp && Math.hypot(x - sp.x, y - sp.y) < 20 * U){
      if (st.kind === 'fire' && st.call.k > 0){ sPop(); for (let i = 0; i < 3; i++) spawnPuff(sp.x + rand(-6, 6) * U, sp.y - 6 * U, 20 * U); }
      else { sHello(); emoji(sp.x, sp.y - 14 * U, st.kind === 'fire' ? '⭐' : '👋', 1, 22); }
      return;
    }

  }
  const v = hitVehicle(x, y);
  if (!v && bank && inBank(x, y, 6 * U)){ tapBank(); return; }

    else if (v === rob.cop && rob.v) v.rider === 'robber' ? sGiggle() : sWhoop();
    else if (v.home && startCall(v.home)){} // at its station: off it goes on a call
    else vehicleSound(v);
    v.bounce = 0.5; sparkle(v.x, v.y, 8); return;
  }
  if (site){
    const q = site.fromW(x, y);
    if (crane){
      const hu = crane.cu + Math.cos(crane.ang) * crane.r, hw = crane.cw + Math.sin(crane.ang) * crane.r;
      if (Math.hypot(q.u - crane.cu, q.w - crane.cw) < 16 * U || Math.hypot(q.u - hu, q.w - hw) < 14 * U || (site.stack && Math.hypot(q.u - site.stack.u, q.w - site.stack.w) < 16 * U)){

  }

  sPop(); sparkle(x, y, 8);
  flowers.push({ nx: x / W, ny: y / H, e: pick(FLOWERS), born: performance.now() / 1000 });
  if (flowers.length > 70) flowers.shift();
}

/* ================= bedtime ================= */
// A play timer the parent sets (10 minutes to start with), so the game ends itself instead of being taken away.
// It winds down gently: a soft chime a minute before, then night falls, a lullaby plays, everything stops, and a
// sleepy night-time cover (a moon, twinkling stars, 💤) fades in over the whole game. Taps do nothing then.
// ⏰ in the parent corner (press and hold 1.2 s) steps the time through 10, 20 and 30 minutes and off, and wakes
// everything up again once it's asleep. Only time with the game on screen counts. It's saved with the setting and
// shared with the other game (the home-screen app can switch between them), and starts afresh after a 20-minute break.
// (The same block is in index.html and builder.html.)
const BED_KEY = 'choochoo-bedtime-v1', BED_OPTS = [10, 20, 30, 0], BED_BREAK = 20 * 60 * 1000;
const bed = { min: 10, used: 0, asleep: false, t: 0, warned: false, saveT: 0, hold: 0, wall: Date.now() };
const bBed = $('bBed'), sleepEl = $('sleep');
const BED_PARENT = ['bBed', 'bBell', 'bMute', 'bFull']; // the only buttons that still work while it's asleep
const sBedWarn = () => { tone(1047, 'sine', 0, 0.02, 0.8, 0.07); tone(784, 'sine', 0.35, 0.02, 1.1, 0.07); };
const sLullaby = () => [392, 392, 587, 587, 659, 659, 587, 523, 523, 494, 494, 440, 440, 392].forEach((f, i) => tone(f, 'sine', i * 0.42 + (i >= 7 ? 0.42 : 0), 0.04, i === 6 || i === 13 ? 1.1 : 0.6, 0.1));
function bedSave(){ try { window.localStorage.setItem(BED_KEY, JSON.stringify({ min: bed.min, used: bed.used, asleep: bed.asleep, at: Date.now() })); } catch (_) {} }
function bedLabel(){ bBed.textContent = '⏰' + (bed.min || '∞'); }
function setLight(){ const tl = $('bLight').firstElementChild; tl.classList.toggle('go', going); tl.classList.toggle('stop', !going); }
function goToSleep(quiet){
  bed.asleep = true; bed.t = quiet ? 10 : 0; bedSave();
  nightT = 1; if (quiet) night = 1; $('bSky').textContent = '☀️';
  going = false; setLight();
  sleepEl.classList.add('show'); // (it takes taps straight away, and fades in a moment later)
  if (quiet) sleepEl.classList.add('on'); else sLullaby();
}
function wakeUp(){
  bed.asleep = false; bed.used = 0; bed.warned = false; bed.t = 0; bedSave();
  sleepEl.classList.remove('show', 'on');
  nightT = 0; $('bSky').textContent = '🌙'; going = true; setLight(); sDay();
}
function nextBedtime(){
  bed.min = BED_OPTS[(BED_OPTS.indexOf(bed.min) + 1) % BED_OPTS.length]; bed.used = 0; bed.warned = false;
  bedLabel(); bedSave(); tone(bed.min ? 440 + bed.min * 20 : 330, 'sine', 0, 0.01, 0.3, 0.15);
}
// first thing every frame: true once it's asleep and everything has stopped (the rest of the update is skipped)
function bedTick(dt){
  const now = Date.now();
  if (now - bed.wall > BED_BREAK){ bed.used = 0; bed.warned = false; if (bed.asleep) wakeUp(); } // back after a long break
  bed.wall = now;
  if (bed.hold && NOW - bed.hold > 1.2){ bed.hold = 0; bBed.classList.remove('hold'); bed.asleep ? wakeUp() : nextBedtime(); }
  if (bed.asleep){
    bed.t += dt;
    if (bed.t > 2.5) sleepEl.classList.add('on');
    return bed.t > 9; // stopped, and the lullaby's finished
  }

/* ================= loop ================= */
function updateCrossing(dt){
  if (!spur){ xing.active = false; xing.bar = 0; return; }
  // Trains on (or just past the stop point of) the crossing always keep it closed. Approaching trains
  // close it too, unless a road vehicle has waited a while: then trains hold at the stop point so the
  // road gets a turn (otherwise lots of trains can starve the site trucks forever).
  // A train up to 2U past the stop point is still obeying the signal (it stays put there, see update), so it counts
  // as approaching, not on the crossing. (With "on" starting at 0.5U, a train that overshot into that sliver held the
  // barriers down while it waited for them: a jam for ever. The traffic sim caught it.)
  const stopPt = spur.S - (ROAD_HALF + 6) * U;
  const occupying = trains.some(tr => { const d = mod(tr.head - stopPt); return d > 2 * U && d < trainLen(tr) + (ROAD_HALF + 32) * U; });
  const approaching = trains.some(tr => mod(tr.head - (spur.S - 130 * U)) <= 130 * U - (ROAD_HALF + 6) * U + 2 * U);
  xing.waitT = xing.waiting ? xing.waitT + dt : 0;
  // The hold lasts till a vehicle has actually been over (as in the builder). It used to end the moment nobody was
  // waiting, which was also the moment the barriers finished lifting and the trucks set off, so down they came again
  // in front of them, over and over: with 5 trains a tipper could wait over a minute.
  if (!xing.hold && xing.waitT > 5){ xing.hold = true; xing.holdT = 0; xing.went = false; }
  if (xing.hold){ xing.holdT += dt; if (xing.anyInZone) xing.went = true; if ((xing.went && !xing.waiting && !xing.anyInZone && xing.holdT > 2) || xing.holdT > 15) xing.hold = false; }
  xing.active = occupying || (approaching && !xing.hold);
  const want = xing.active && !xing.anyInZone ? 1 : 0;
  xing.bar = want > xing.bar ? Math.min(1, xing.bar + dt / 0.8) : Math.max(0, xing.bar - dt / 0.8);
  if (xing.active || xing.bar > 0.02){ xing.bellT -= dt; if (xing.bellT <= 0){ sBell(); xing.bellT = 0.45; } } else xing.bellT = 0;
}
function update(dt){
  if (bedTick(dt)) return;
  if (resetHold && NOW - resetHold > 1.2){ resetHold = 0; bReset.classList.remove('hold'); resetAll(); return; }
  night += clamp(nightT - night, -dt * 1.2, dt * 1.2);
  const target = SPEEDS[speedIdx] * U;
  const s = [...trains].sort((a, b) => mod(a.head) - mod(b.head));
  for (let i = 0; i < s.length; i++){
    const tr = s[i];
    tr.bounce = Math.max(0, tr.bounce - dt); tr.cool = Math.max(0, tr.cool - dt); tr.wave = Math.max(0, (tr.wave || 0) - dt);
    tr.dragV *= Math.exp(-dt * 6);
    for (const car of tr.cars) car.jump = Math.max(0, car.jump - dt);
    if (tr.drag){ tr.v = 0; continue; }
    tr.pause = Math.max(0, tr.pause - dt);
    let want = going && tr.pause <= 0 ? target : 0;
    if (s.length > 1){
      const A = s[(i + 1) % s.length], gap = mod(A.head - tr.head) - trainLen(A) - 16 * U;
      want = Math.min(want, Math.max(0, gap * 2.5));
    }
    if (spur && (xing.anyInZone || xing.bar < 0.95 || xing.hold)){
      let d = mod(spur.S - (ROAD_HALF + 6) * U - tr.head);
      if (d > TL - 2 * U) d = 0; // nose just past the stop point: stay put
      if (d < 150 * U) want = Math.min(want, Math.max(0, d * 2.5));
    }
    tr.v = want < tr.v ? Math.max(want, tr.v - 320 * U * dt) : Math.min(want, tr.v + 70 * U * dt);
    const prev = tr.head, step = tr.v * dt;
    tr.head = mod(tr.head + step);
    if (going && tr.cool <= 0 && step > 0 && mod(station.s - prev) < step){ tr.pause = 1.8; tr.cool = 5; sDing(); }
    // train wash: about 2 in 5 trains stop with the engine in the shed for a scrub
    if (trainWash && going && step > 0 && tr.pause <= 0 && mod(trainWash.sStop - prev) < step && Math.random() < 0.45){ tr.pause = 3.2; tr.wash = 3.2; sSpray(); }
  }
  for (const tr of trains){
    computeGeo(tr);
    if (tr.wash > 0){
      tr.wash -= dt; if (trainWash) trainWash.busy = 0.3;
      const g = tr.geo[0]; if (g && Math.random() < dt * 14) bubbles(g.x, g.y, 2, g.len * 0.45);
      if (tr.wash <= 0){ tr.shine = 5; if (g) sparkle(g.x, g.y, 14); }
    }
    if (tr.shine > 0){ tr.shine -= dt; const g = tr.geo[0]; if (g && Math.random() < dt * 6) sparkle(g.x + rand(-20, 20) * U, g.y + rand(-10, 10) * U, 1); }
    const speed = tr.drag ? tr.dragV : Math.max(tr.v, tr.dragV);
    tr.smokeT -= dt;
    if (speed > 6 * U && tr.smokeT <= 0 && !inTunnel(tr.head - 12 * U)){
      const g = tr.geo[0], ch = g.len / 2 - 12 * U;
      spawnPuff(g.x + Math.cos(g.a) * ch, g.y + Math.sin(g.a) * ch);
      tr.smokeT = 0.34 - Math.min(1, speed / (150 * U)) * 0.22;
    }
  }
  updateVehicles(dt);
  updateTraffic(dt);
  updateRobber(dt);
  updateStations(dt);
  updateCrossing(dt);
  updateSite(dt);
  updateWorks(dt);
  for (const w of [carWash, trainWash]) if (w){ w.busy = Math.max(0, w.busy - dt); w.spin += dt * (w.busy > 0 ? 14 : 0.6); }
  for (let i = puffs.length - 1; i >= 0; i--){
    const p = puffs[i]; p.life += dt;
    if (p.life > p.max){ puffs.splice(i, 1); continue; }
    if (!p.ring){ p.x += p.vx * dt; p.y += p.vy * dt; p.r += p.vr * dt; }
  }
  for (let i = fx.length - 1; i >= 0; i--){
    const p = fx[i]; p.life += dt;
    if (p.life > p.max){ fx.splice(i, 1); continue; }
    p.x += p.vx * dt; p.y += p.vy * dt;
    if (p.g) p.vy += p.g * dt; else if (p.t === 'dot'){ p.vx *= Math.exp(-dt * 3); p.vy *= Math.exp(-dt * 3); }
  }
  if (fx.length > 400) fx.splice(0, fx.length - 400);
  for (const t of trees) t.wig = Math.max(0, t.wig - dt);
  duck.flap = Math.max(0, duck.flap - dt);
}
