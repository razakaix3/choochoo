<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Choo Choo! Build</title>
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Choo Choo">
<meta name="theme-color" content="#c68a52">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
:root{
  --shelf:#c68a52; --shelf-edge:#9c6534; --shelf-grain:rgba(90,50,20,.18);
  --b1:#e63946; --b2:#ffbe0b; --b3:#3a86ff; --b4:#2a9d8f; --b5:#8338ec; --b6:#fb8500;
  --btn-edge:rgba(0,0,0,.28);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  background:var(--shelf);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --shelf:#8a5a33; --shelf-edge:#5e3a1e; --shelf-grain:rgba(0,0,0,.22); }
}
:root[data-theme="dark"]{ --shelf:#8a5a33; --shelf-edge:#5e3a1e; --shelf-grain:rgba(0,0,0,.22); }
html{ scroll-padding-top:env(safe-area-inset-top,0px); height:100%; }
body{
  height:100%; margin:0; overflow:hidden; background:var(--shelf);
  touch-action:none; user-select:none; -webkit-user-select:none; -webkit-touch-callout:none;
  overscroll-behavior:none; -webkit-tap-highlight-color:transparent;
  font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
}
#app{ height:100%; display:flex; flex-direction:column; }
#stage{ flex:1; position:relative; min-height:0; background:#8acb68; }
#c{ position:absolute; inset:0; width:100%; height:100%; display:block; touch-action:none; }
#bar{
  flex:none; display:flex; justify-content:center; align-items:center;
  gap:clamp(6px,2.4vw,24px); padding:12px 8px 14px;
  background:
    repeating-linear-gradient(92deg, transparent 0 22px, var(--shelf-grain) 22px 24px, transparent 24px 61px),
    var(--shelf);
  border-top:5px solid var(--shelf-edge);
  transition:box-shadow .15s;
}
#bar.drop{ box-shadow:inset 0 0 0 6px rgba(255,255,255,.55); }
.grp, .row{ display:flex; align-items:center; justify-content:center; gap:clamp(6px,2.4vw,24px); }
.grp[hidden], .row[hidden]{ display:none; }
#gBuild{ flex-direction:column; gap:10px; }
.row.tools{ gap:clamp(2px,0.8vw,16px); }
.btn{
  position:relative; flex:none;
  width:clamp(34px,11vw,84px); height:clamp(34px,11vw,84px);
  border-radius:50%; border:none; padding:0; margin:0; cursor:pointer;
  font-size:clamp(18px,5.6vw,40px); line-height:1;
  display:grid; place-items:center; touch-action:none;
  box-shadow:inset 0 -6px 0 var(--btn-edge), inset 0 5px 0 rgba(255,255,255,.35), 0 5px 0 var(--shelf-edge);
  transition:transform .08s ease, box-shadow .08s ease, opacity .15s;
}
.btn:focus-visible{ outline:4px solid #fff; outline-offset:3px; }
.btn.pressed{ transform:translateY(4px); box-shadow:inset 0 -3px 0 var(--btn-edge), inset 0 3px 0 rgba(255,255,255,.3), 0 1px 0 var(--shelf-edge); }
.btn.shake{ animation:shake .35s ease; }
@keyframes shake{ 20%{transform:translateX(-6px)} 40%{transform:translateX(6px)} 60%{transform:translateX(-4px)} 80%{transform:translateX(3px)} }
#bAdd{ background:var(--b1); } #bRemove{ background:var(--b6); } #bHorn{ background:var(--b2); }
#bLight{ background:var(--b4); } #bSpeed{ background:var(--b3); } #bSky{ background:var(--b5); }
#bMode{ background:#f4f1ea; }
.piece{ border-radius:16px; background:#9fd67e; }
.piece canvas{ display:block; width:100%; height:100%; pointer-events:none; }
.road.piece{ background:#c9e9b4; }
#tST{ background:#ffd6a5; } #tTN{ background:#b5e48c; } #tXR, #tXR2, #tXD, #tXD2{ background:#fdffb6; }
.tilt{ display:inline-block; transform:rotate(-45deg); }
#pTree{ background:#b5e48c; } #pHouse{ background:#ffadad; } #pPond{ background:#9bf6ff; }
.mini{ width:clamp(30px,8.6vw,76px); height:clamp(30px,8.6vw,76px); }
.mini canvas{ display:block; width:100%; height:100%; pointer-events:none; }
.veh{ background:#cfe8ff; } .site{ background:#ffe39a; }
#rowCar, #rowSite{ gap:clamp(3px,1.2vw,18px); }
.tools .btn{ width:clamp(24px,6.2vw,64px); height:clamp(24px,6.2vw,64px); font-size:clamp(13px,3.4vw,30px); background:#e9dcc9; }
.row.tools{ flex-wrap:wrap; }
.tools .tab.on{ background:#fff; box-shadow:inset 0 -4px 0 var(--btn-edge), 0 0 0 4px #ffd23f, 0 4px 0 4px var(--shelf-edge); }
.tools .tool.on{ background:#ffd23f; box-shadow:inset 0 -4px 0 var(--btn-edge), 0 0 0 4px #fff, 0 4px 0 4px var(--shelf-edge); }
.tools .off{ opacity:.35; }
.tools .sep{ width:clamp(2px,1vw,12px); }
.plus{
  position:absolute; top:-2px; right:-2px; width:36%; height:36%; border-radius:50%;
  background:#fff; color:var(--b1); font-weight:900; font-size:clamp(13px,3.4vw,24px);
  display:grid; place-items:center; box-shadow:0 2px 0 rgba(0,0,0,.25);
}
.plus.minus{ color:var(--b6); }
.tl{ width:38%; height:74%; background:#262626; border-radius:12px; display:flex; flex-direction:column; justify-content:space-evenly; align-items:center; box-shadow:0 2px 0 rgba(0,0,0,.3); }
.tl i{ display:block; width:68%; aspect-ratio:1; border-radius:50%; background:#4a2020; transition:background .15s, box-shadow .15s; }
.tl i.g{ background:#1f3d24; }
.tl.stop i.r{ background:#ff3b3b; box-shadow:0 0 10px #ff5a5a; }
.tl.go i.g{ background:#3ee06a; box-shadow:0 0 10px #5dff88; }
#parent{ position:absolute; top:6px; right:6px; display:flex; gap:6px; z-index:2; }
.pbtn{
  width:36px; height:36px; border-radius:10px; border:none; cursor:pointer; padding:0;
  background:rgba(255,255,255,.5); font-size:18px; opacity:.55; display:grid; place-items:center;
  transition:opacity .2s, transform .2s; touch-action:none;
}
.pbtn.hold{ opacity:1; transform:scale(1.25); transition:opacity .2s, transform 1.2s linear; }
.pbtn:focus-visible{ outline:3px solid #fff; opacity:1; }
.pbtn[hidden]{ display:none; }
#bBed{ width:auto; min-width:36px; padding:0 5px; font-size:14px; }
/* bedtime: the sleepy cover over the whole game (the parent corner stays on top of it) */
#sleep{ position:fixed; inset:0; z-index:1; display:none; opacity:0; transition:opacity 3s ease; overflow:hidden; touch-action:none;
  background:radial-gradient(circle at 50% 44%, rgba(34,46,110,.78), rgba(8,12,40,.94) 75%); }
#sleep.show{ display:block; }
#sleep.on{ opacity:1; }
#sleep .moon{ position:absolute; left:50%; top:44%; font-size:min(30vw,30vh); line-height:1; transform:translate(-50%,-50%);
  animation:sway 7s ease-in-out infinite; filter:drop-shadow(0 0 24px rgba(255,236,160,.55)); }
#sleep .zz{ position:absolute; left:58%; top:30%; font-size:min(10vw,10vh); line-height:1; animation:zz 4.5s ease-in infinite; }
#sleep i{ position:absolute; width:5px; height:5px; border-radius:50%; background:#fff6c8; box-shadow:0 0 6px #fff6c8; animation:tw 3.2s ease-in-out infinite; }
@keyframes tw{ 0%,100%{ opacity:.15 } 50%{ opacity:1 } }
@keyframes zz{ 0%{ transform:translate(0,30px) scale(.6); opacity:0 } 25%{ opacity:1 } 100%{ transform:translate(50px,-70px) scale(1.15); opacity:0 } }
@keyframes sway{ 0%,100%{ transform:translate(-50%,-50%) rotate(-5deg) } 50%{ transform:translate(-50%,-53%) rotate(5deg) } }
</style>
</head>

        <button class="btn piece road" id="tRC" aria-label="Road bend"><canvas id="cRC"></canvas></button>
        <button class="btn piece road" id="tRT" aria-label="Road junction"><canvas id="cRT"></canvas></button>
        <button class="btn piece road" id="tRY" aria-label="Road fork"><canvas id="cRY"></canvas></button>
        <button class="btn" id="tXR2" aria-label="Level crossing">🚧</button>

        <button class="btn mini veh" id="vCar" aria-label="Car"><canvas id="cvCar"></canvas></button>
        <button class="btn mini veh" id="vBus" aria-label="Bus"><canvas id="cvBus"></canvas></button>
        <button class="btn mini veh" id="vFire" aria-label="Fire engine"><canvas id="cvFire"></canvas></button>
        <button class="btn mini veh" id="vPolice" aria-label="Police car"><canvas id="cvPolice"></canvas></button>
        <button class="btn mini veh" id="vAmbulance" aria-label="Ambulance"><canvas id="cvAmbulance"></canvas></button>
        <button class="btn mini veh" id="vTractor" aria-label="Tractor"><canvas id="cvTractor"></canvas></button>
        <button class="btn mini veh" id="vTipper" aria-label="Tipper truck"><canvas id="cvTipper"></canvas></button>
        <button class="btn mini veh" id="vMixer" aria-label="Cement mixer"><canvas id="cvMixer"></canvas></button>
      </div>
      <div class="row" id="rowProp" hidden>
        <button class="btn" id="pTree" aria-label="Tree">🌳</button>
        <button class="btn" id="pHouse" aria-label="House">🏠</button>
        <button class="btn" id="pPond" aria-label="Duck pond">🦆</button>
      </div>
      <div class="row" id="rowSite" hidden>
        <button class="btn mini site" id="sCrane" aria-label="Tower crane"><canvas id="csCrane"></canvas></button>
        <button class="btn mini site" id="sBuild" aria-label="House being built"><canvas id="csBuild"></canvas></button>
        <button class="btn mini site" id="sDigger" aria-label="Digger"><canvas id="csDigger"></canvas></button>
        <button class="btn mini site" id="sDozer" aria-label="Bulldozer"><canvas id="csDozer"></canvas></button>
        <button class="btn mini site" id="sSand" aria-label="Sand pile"><canvas id="csSand"></canvas></button>
        <button class="btn mini site" id="sCones" aria-label="Cones"><canvas id="csCones"></canvas></button>
        <button class="btn mini site" id="sHut" aria-label="Site hut"><canvas id="csHut"></canvas></button>
      </div>
      <div class="row tools">
        <button class="btn tab on" id="kRail" aria-label="Track pieces">🛤️</button>
        <button class="btn tab" id="kSpec" aria-label="Station, tunnel and crossing">🚉</button>
        <button class="btn tab" id="kRoad" aria-label="Roads">🛣️</button>
        <button class="btn tab" id="kCar" aria-label="Cars, buses, fire engines and ambulances">🚗</button>
        <button class="btn tab" id="kProp" aria-label="Trees, houses and ponds">🌳</button>
        <button class="btn tab" id="kSite" aria-label="Building site">🏗️</button>

        <button class="btn tool" id="tDel" aria-label="Rubber: tap or rub things to take them away">🧹</button>
        <button class="btn tool off" id="tUndo" aria-label="Undo">↩️</button>
        <button class="btn tool off" id="tRedo" aria-label="Redo">↪️</button>

    </div>
    <button class="btn" id="bMode" aria-label="Build the track, or play with the trains">🔨</button>
  </div>
</div>

<script>
(() => {
'use strict';
const $ = id => document.getElementById(id);
const stage = $('stage'), cv = $('c'), ctx = cv.getContext('2d'), bar = $('bar');
const grass = document.createElement('canvas'), gctx = grass.getContext('2d');
const bg = document.createElement('canvas'), bctx = bg.getContext('2d');
let W = 0, H = 0, DPR = 1, NOW = 0, SU = 1;
// Everything on the table lives in world units (track is 28 wide) and is drawn through the view
// transform, so U is 1. SU is the screen-space scale used for the grass.
const U = 1;

const TAU = Math.PI * 2;
const rand = (a, b) => a + Math.random() * (b - a);
const pick = a => a[Math.floor(Math.random() * a.length)];
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const ease = k => 0.5 - 0.5 * Math.cos(Math.PI * clamp(k, 0, 1));
const angDiff = (a, b) => { let d = (a - b) % TAU; if (d > Math.PI) d -= TAU; if (d < -Math.PI) d += TAU; return d; };
const modL = (v, L) => ((v % L) + L) % L;
const EF = '"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';
function mulberry(seed){ return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function shade(hex, p){
  const n = parseInt(hex.slice(1), 16); let r = n >> 16, g = n >> 8 & 255, b = n & 255;
  const t = p < 0 ? 0 : 255, a = Math.abs(p);
  r = Math.round((t - r) * a + r); g = Math.round((t - g) * a + g); b = Math.round((t - b) * a + b);
  return `rgb(${r},${g},${b})`;
}
function rr(c, x, y, w, h, r){
  if (w < 0){ x += w; w = -w; } if (h < 0){ y += h; h = -h; }
  r = Math.max(0, Math.min(r, w / 2, h / 2));
  c.beginPath(); c.moveTo(x + r, y);
  c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r);
  c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath();
}
function circle(c, x, y, r){ c.beginPath(); c.arc(x, y, Math.max(0, r), 0, TAU); }

const ENGINE_COLORS = ['#e63946','#3a86ff','#ffbe0b','#2a9d8f','#8338ec','#fb8500','#ff5d8f'];
const WAGON_COLORS = ['#ffadad','#ffd6a5','#fdffb6','#caffbf','#9bf6ff','#a0c4ff','#bdb2ff','#ffc6ff'];
const ANIMALS = ['🐶','🐱','🐻','🐰','🐷','🐸','🐵','🐮','🦁','🐯','🐼','🐨','🐔','🐧','🦊','🐭'];
const FLOWERS = ['🌷','🌼','🌻','🌸','🌺'];
const CAR_COLORS = ['#e63946','#3a86ff','#ffbe0b','#2a9d8f','#fb8500','#8338ec','#f15bb5','#f4f4f4'];
const TREE_COLORS = ['#2f7d32', '#3b8f3a', '#2c6e49', '#468a2c'];
const ROOFS = ['#d64545', '#2d6cdf', '#f08c2b', '#7b4fd6', '#2a9d8f'];

/* ================= sound ================= */
let AC = null, muted = false, bellMuted = false, noiseBuf = null;
function audio(){
  if (muted) return null;
  try {
    if (!AC){ const C = window.AudioContext || window.webkitAudioContext; if (!C) return null; AC = new C(); }
    if (AC.state === 'suspended') AC.resume();
  } catch (e) { return null; }
  return AC;
}
function noise(a){
  if (!noiseBuf){ noiseBuf = a.createBuffer(1, a.sampleRate, a.sampleRate); const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1; }
  const s = a.createBufferSource(); s.buffer = noiseBuf; return s;
}
function envGain(a, t, peak, att, dec, dest){
  const g = a.createGain();
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(peak, t + att);
  g.gain.exponentialRampToValueAtTime(0.0001, t + att + dec);
  g.connect(dest || a.destination); return g;
}
function tone(freq, type, delay, att, dec, peak, endFreq){
  const a = audio(); if (!a) return;
  const t = a.currentTime + delay, g = envGain(a, t, peak, att, dec);
  const o = a.createOscillator(); o.type = type;
  o.frequency.setValueAtTime(freq, t);
  if (endFreq) o.frequency.exponentialRampToValueAtTime(endFreq, t + att + dec);
  o.connect(g); o.start(t); o.stop(t + att + dec + 0.05);
}
function sToot(pitch){
  const a = audio(); if (!a) return;
  const t = a.currentTime;
  const lp = a.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 1500;
  const g = a.createGain(), P = 0.075;
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(P, t + 0.04); g.gain.setValueAtTime(P, t + 0.2);
  g.gain.exponentialRampToValueAtTime(0.0001, t + 0.28);
  g.gain.exponentialRampToValueAtTime(P, t + 0.34); g.gain.setValueAtTime(P, t + 0.72);
  g.gain.exponentialRampToValueAtTime(0.0001, t + 0.98);
  lp.connect(g); g.connect(a.destination);
  [370, 466, 554].forEach(f => {
    f *= pitch;
    const o = a.createOscillator(); o.type = 'sawtooth';
    o.frequency.setValueAtTime(f * 0.94, t); o.frequency.exponentialRampToValueAtTime(f, t + 0.06);
    const v = a.createOscillator(); v.frequency.value = 6;
    const vg = a.createGain(); vg.gain.value = f * 0.006;
    v.connect(vg); vg.connect(o.frequency); o.connect(lp);
    o.start(t); v.start(t); o.stop(t + 1.02); v.stop(t + 1.02);
  });
}

function makePath(pts, closed){

// A house being built: a foundation with a ring of 8 block slots, 2 layers. Blocks go on the lowest layer

  if (kindOf(p) || PT[p.type].jct || PT[p.type].link || !cp) return null;
  const sec = [p];
  for (const e0 of [0, 1]){
    let cur = p, e = e0;
    for (let k = 0; k < 4; k++){ const c = cur.conn[e]; if (!c || sec.includes(c.p) || kindOf(c.p) || PT[c.p.type].jct || PT[c.p.type].link || c.e > 1) break; sec.push(c.p); cur = c.p; e = 1 - c.e; }
  }
  if (sec.length >= cp.n) sec.pop(); // always leave something to bend from
  if (!sec.length) return null;
  const set = new Set(sec), links = [];
  for (const q of sec) for (const c of q.conn) if (c && !set.has(c.p)) links.push(c);
  if (!links.length) return null;
  const st = liftSet(sec);
  return { kind: 'bend', st, net, anchors: links.map(c => c.p.ends[c.e]), plan: null, ok: false, dirty: true, t: -1, moved: true };
}
function bendPlan(anchors, F, budget, net = 'rail'){ // A -> near the finger -> B (or just A -> finger if there's no B)
  const [A, B] = anchors, near = Math.hypot(F.x - A.x, F.y - A.y) < 60;
  if (!B && near) return null;
  const legs = B && near ? [[]] : planFill(A, F, { types: BIG[net], radius: 50, multi: B ? 4 : 1, budget });
  for (const leg of legs){
    if (!B) return leg.length ? leg : null;
    const Ns = leg.map(s => s.N), tip = Ns.length ? Ns[Ns.length - 1].ends[1] : A;
    const leg2 = planFill(tip, B, { types: BIG[net], extra: Ns, budget }) || planFill(tip, B, { types: ALL[net], extra: Ns, budget: budget / 2 });
    if (leg2) return leg.concat(leg2);
  }
  return null;
}
function commitBend(d){
  if (d.w && (d.dirty || !d.ok)){ const pl = bendPlan(d.anchors, d.w, 6000, d.net); if (pl){ d.plan = pl; d.ok = true; } }
  const placed = [];
  for (const s of d.plan || []){
    const N = place(s.t, s.pose);
    if (!N){ for (const q of placed) lift(q); placed.length = 0; break; }
    placed.push(N);
  }
  if (!placed.length){ if (d.st){ restoreGroup(d.st, false); sNo(); } else sPop(); layoutChanged(true); return; }
  layoutChanged(true); sClack(); sel = new Set();
  for (const N of placed) sparkle(N.cx, N.cy, 3);
  const last = placed[placed.length - 1];
  if (last.conn[0] && last.conn[1]) celebrate(last);
  else if (!d.st && !last.conn[1]) lastEnd = { p: last, e: 1 };
}

/* ---------- the rubber (the 🧹 tool) ---------- */
function eraseAt(w){ // take away whatever is under the finger (his own vehicles, not the plain cars every road gets)
  const v = hitCar(w.x, w.y);
  if (v && v.mine){ cars.splice(cars.indexOf(v), 1); sparkle(v.x, v.y, 10); sRub(); layoutChanged(false); return true; }
  const q = hitProp(w.x, w.y);
  if (q){ props.splice(props.indexOf(q), 1); sparkle(q.x, q.y, 10); sRub(); layoutChanged(false); return true; }
  const p = hitPiece(w.x, w.y);
  if (p){ lift(p); sparkle(p.cx, p.cy, 10); sRub(); layoutChanged(false); return true; }
  return false;
}

/* ---------- undo and redo ---------- */
// The whole table is snapshotted (as saved) once each action has finished; undo and redo step through
// the snapshots. Trains on the table come back when building ends.
const hist = { list: [], i: -1, dirty: false };
const snapshot = () => JSON.stringify(serialize());
function histReset(){ hist.list = [snapshot()]; hist.i = 0; hist.dirty = false; refreshHist(); }
function histTick(){
  if (!hist.dirty || drags.size || anims.length || fillQ) return;
  hist.dirty = false;
  recentre();
  const s = snapshot(); if (s === hist.list[hist.i]) return;
  hist.list.length = hist.i + 1; hist.list.push(s);
  if (hist.list.length > 80) hist.list.shift();
  hist.i = hist.list.length - 1; refreshHist();
}
// Once an action has finished, everything slides so the layout sits in the middle of the table, and the
// view slides with it, so nothing moves on screen. The table's edge can't be seen, and a layout that grew
// off to one side used to hit it: Ben found a road end that took no pieces at all, with most of the
// table empty on the other side.
function recentre(){
  let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
  for (const p of pieces){ x0 = Math.min(x0, p.bb[0]); y0 = Math.min(y0, p.bb[1]); x1 = Math.max(x1, p.bb[2]); y1 = Math.max(y1, p.bb[3]); }
  for (const q of props){ x0 = Math.min(x0, q.x - q.r); y0 = Math.min(y0, q.y - q.r); x1 = Math.max(x1, q.x + q.r); y1 = Math.max(y1, q.y + q.r); }
  if (x0 > x1) return;
  const dx = -Math.round((x0 + x1) / 2), dy = -Math.round((y0 + y1) / 2);
  if (Math.abs(dx) < 40 && Math.abs(dy) < 40) return;
  const mv = o => { o.x += dx; o.y += dy; };
  for (const p of pieces){ mv(p); if (p.link){ p.link.x1 += dx; p.link.y1 += dy; } geomPiece(p); }
  for (const a of [props, cars, garage, puffs, fx, flowers, rings]) a.forEach(mv);
  mv(view); mv(vt);
  if (pickEnd) pickEnd = pickEnd.p.ends[pickEnd.i]; // the ends were made afresh
  buildRoutes(); save(); bgDirty = true;
  for (const tr of trains) if (!tr.lost) computeGeo(tr);
}
function refreshHist(){ $('tUndo').classList.toggle('off', hist.i <= 0); $('tRedo').classList.toggle('off', hist.i >= hist.list.length - 1); }
function undoRedo(step){
  if (anims.length || fillQ) step = 0; // a join still going on: undo just stops it
  histTick();
  const k = hist.i + step;
  if (k < 0 || k >= hist.list.length){ sNo(); shakeBtn($(step < 0 ? 'tUndo' : 'tRedo')); return; }
  for (const d of drags.values()) cancelDrag(d);
  drags.clear(); anims.length = 0; fillQ = null; pickEnd = null;
  hist.i = k; deserialize(JSON.parse(hist.list[k]));
  for (const tr of trains){ if (!tr.lost) for (const g of tr.geo) sparkle(g.x, g.y, 3); tr.lost = true; }
  layoutChanged(true); hist.dirty = false; refreshHist();
  sUndo(step < 0); for (const p of pieces) sparkle(p.cx, p.cy, 1);
}

/* ---------- saving ---------- */
const KEY = 'choochoo-build-v1';
const r2 = v => Math.round(v * 100) / 100;
function serialize(){
  const idx = new Map(pieces.map((p, i) => [p, i])), c = [];
  pieces.forEach((p, i) => p.conn.forEach((q, e) => { if (q && idx.get(q.p) > i) c.push([i, e, idx.get(q.p), q.e]); }));
  return { v: 1, p: pieces.map(p => [p.type, r2(p.x), r2(p.y), p.r, p.f, p.flex ? [p.flex.e, r2(p.flex.dx), r2(p.flex.dy)] : 0, p.link ? [r2(p.link.x1), r2(p.link.y1), p.link.d1, r2(p.link.k0 || 0), r2(p.link.k1 || 0)] : 0]), c,
    pr: props.map(q => [q.kind, r2(q.x), r2(q.y), q.v]),
    vh: [...cars.filter(v => v.mine), ...garage].map(v => [v.type, v.color, r2(v.x), r2(v.y), r2(v.a)]) };
}
function deserialize(o){
  if (!o || o.v !== 1 || !Array.isArray(o.p) || o.p.length > 500) return false;
  const list = [];
  for (const a of o.p){
    if (!Array.isArray(a) || !PT[a[0]] || ![a[1], a[2], a[3]].every(Number.isFinite)) return false;
    const lk = a[6];
    if (PT[a[0]].link && !(Array.isArray(lk) && Number.isFinite(lk[0]) && Number.isFinite(lk[1]))) return false;
    const p = newPiece(a[0], { x: a[1], y: a[2], r: a[3] | 0, f: a[4], link: lk ? { x1: lk[0], y1: lk[1], d1: ((lk[2] | 0) % 8 + 8) % 8, k0: +lk[3] || 0, k1: +lk[4] || 0 } : null });
    if (Array.isArray(a[5]) && Number.isFinite(a[5][1]) && Number.isFinite(a[5][2])){ p.flex = { e: a[5][0] ? 1 : 0, dx: a[5][1], dy: a[5][2] }; geomPiece(p); }
    list.push(p);
  }
  for (const k of Array.isArray(o.c) ? o.c : []){
    const [i, e, j, f] = k, A = list[i], B = list[j];
    if (A && B && A !== B && e >= 0 && e < A.conn.length && f >= 0 && f < B.conn.length && !A.conn[e] && !B.conn[f] && A.ends[e].net === B.ends[f].net) link(A, e, B, f);
  }
  const pl = [];
  for (const a of Array.isArray(o.pr) ? o.pr : []) if (Array.isArray(a) && PROPS[a[0]] && Number.isFinite(a[1]) && Number.isFinite(a[2])) pl.push(makeProp(a[0], a[1], a[2], (a[3] | 0) & 7));
  const vl = [];
  for (const a of Array.isArray(o.vh) ? o.vh.slice(0, 100) : []){
    if (!Array.isArray(a) || !VT[a[0]] || !/^#[0-9a-f]{6}$/i.test(a[1]) || !Number.isFinite(a[2]) || !Number.isFinite(a[3])) continue;
    const v = makeCar(a[0], a[1], true); v.x = a[2]; v.y = a[3]; v.a = +a[4] || 0; vl.push(v);
  }
  pieces = list; props = pl; lastEnd = null; pickEnd = null; sel.clear();
  cars = cars.filter(v => !v.mine); garage = vl; // his vehicles go back on the roads in buildRoutes
  findComps('comp', 'rail'); findComps('rcomp', 'road'); buildRoutes();
  return true;
}
function save(){ try { if (window.localStorage) window.localStorage.setItem(KEY, JSON.stringify(serialize())); } catch (_) {} }
function loadSaved(){
  try { const s = window.localStorage && window.localStorage.getItem(KEY); return s ? deserialize(JSON.parse(s)) : false; }
  catch (_) { return false; }
}

/* ================= view ================= */
// tray buttons for scenery and the building site (props), and vehicles
const PTRAY = { pTree: 'tree', pHouse: 'house', pPond: 'pond', sCrane: 'crane', sBuild: 'build', sDigger: 'digger', sDozer: 'dozer', sSand: 'sand', sCones: 'cones', sHut: 'hut' };
const VTRAY = { vCar: 'car', vBus: 'bus', vFire: 'fire', vPolice: 'police', vAmbulance: 'ambulance', vTractor: 'tractor', vTipper: 'tipper', vMixer: 'mixer' };
// The view shows at least 760 world units across the short side of the screen and zooms out
// (never below 30%) to fit whatever has been built.
const view = { x: 0, y: 0, z: 1 }, vt = { x: 0, y: 0, z: 1 };
let bgDirty = true;
function fitView(snap){
  if (!W || !H) return;
  const zn = Math.min(W, H) / 760;
  let x0 = -W / zn / 2, x1 = W / zn / 2, y0 = -H / zn / 2, y1 = H / zn / 2;
  for (const p of pieces){ x0 = Math.min(x0, p.bb[0] - 24); y0 = Math.min(y0, p.bb[1] - 24); x1 = Math.max(x1, p.bb[2] + 24); y1 = Math.max(y1, p.bb[3] + 24); }
  for (const q of props){ x0 = Math.min(x0, q.x - q.r - 24); y0 = Math.min(y0, q.y - q.r - 24); x1 = Math.max(x1, q.x + q.r + 24); y1 = Math.max(y1, q.y + q.r + 24); }
  vt.z = Math.max(zn * 0.3, Math.min(W / (x1 - x0), H / (y1 - y0)));
  vt.x = (x0 + x1) / 2; vt.y = (y0 + y1) / 2;
  if (snap){ Object.assign(view, vt); bgDirty = true; }
}
const toW = (x, y) => ({ x: (x - W / 2) / view.z + view.x, y: (y - H / 2) / view.z + view.y });
function worldTf(c){ c.setTransform(DPR * view.z, 0, 0, DPR * view.z, DPR * (W / 2 - view.x * view.z), DPR * (H / 2 - view.y * view.z)); }

/* ================= drawing the track ================= */
const WOOD = ['#dcab70', '#a66f38', '#e5b981'];
const woodTone = (p, i) => shade(WOOD[i], (((p.id * 37) % 9) - 4) / 70);
function drawPieces(c, list){
  list = list.filter(p => netOf(p.type) === 'rail');
  c.lineJoin = 'round'; c.lineCap = 'butt';
  c.save(); c.translate(2, 3.5); c.strokeStyle = 'rgba(0,0,0,0.17)'; c.lineWidth = TW + 3; for (const p of list) strokePath(c, p.P); c.restore();
  for (const p of list){ c.strokeStyle = woodTone(p, 0); c.lineWidth = TW; strokePath(c, p.P); }
  c.strokeStyle = WOOD[1]; c.lineWidth = 17; for (const p of list) strokePath(c, p.P);
  for (const p of list){ c.strokeStyle = woodTone(p, 2); c.lineWidth = 9; strokePath(c, p.P); }
  c.strokeStyle = 'rgba(110,62,24,0.55)'; c.lineWidth = 1.6;
  for (const p of list) for (let e = 0; e < 2; e++){
    const E = p.ends[e], u = DIR[E.d]; c.beginPath(); c.moveTo(E.x - u.y * 14, E.y + u.x * 14); c.lineTo(E.x + u.y * 14, E.y - u.x * 14); c.stroke();
  }
  // Each joint shows one piece's peg sitting in the other's hole. Loose ends: peg on end 1, hole on end 0.
  const pegs = [];
  for (const p of list) for (let e = 0; e < 2; e++){
    const q = p.conn[e], E = p.ends[e];
    if (q ? p.id < q.p.id : e === 1){ pegs.push([E, p]); continue; }
    c.save(); c.translate(E.x, E.y); c.rotate(E.d * Math.PI / 4);
    c.fillStyle = '#7a4a22'; c.fillRect(-6, -3.3, 6.5, 6.6); circle(c, -8.5, 0, 6.2); c.fill();
    c.restore();
  }
  for (const [E, p] of pegs){
    c.save(); c.translate(E.x, E.y); c.rotate(E.d * Math.PI / 4);
    c.fillStyle = woodTone(p, 0); c.fillRect(-2, -2.8, 9.5, 5.6); circle(c, 8.8, 0, 5.3); c.fill();
    c.strokeStyle = 'rgba(110,62,24,0.5)'; c.lineWidth = 1.1; c.stroke();
    c.restore();
  }
}
const inPieceFrame = (c, p) => { c.translate(p.x, p.y); c.rotate(p.r * Math.PI / 4); };
function drawRoads(c, list){ // road pieces and the crossings' bits of road, with turning circles at loose ends
  const segs = [], caps = [];
  for (const p of list){
    const P = netOf(p.type) === 'road' ? p.P : p.RP; if (!P) continue;
    segs.push({ P, p });
    if (p.BP) segs.push({ P: p.BP, p, side: true });
    p.ends.forEach((E, e) => { if (E.net === 'road' && !p.conn[e]) caps.push(E); });
  }
  if (!segs.length) return;
  c.lineJoin = 'round'; c.lineCap = 'butt';
  const layer = (col, w, dx, dy) => {
    c.save(); c.translate(dx || 0, dy || 0); c.strokeStyle = col; c.fillStyle = col; c.lineWidth = w;
    for (const s of segs) strokePath(c, s.P);
    for (const E of caps){ circle(c, E.x, E.y, w / 2); c.fill(); }
    c.restore();
  };
  layer('rgba(0,0,0,0.15)', ROAD_HALF * 2 + 4, 2, 3);
  layer('#d7d2c8', ROAD_HALF * 2 + 5);
  layer('#6e737b', ROAD_HALF * 2);
  c.strokeStyle = 'rgba(255,255,255,0.85)'; c.lineWidth = 2; c.setLineDash([10, 10]);
  for (const s of segs){
    if (kindOf(s.p) === 'crossing'){ const b = s.p.road.bar; strokePath(c, s.P, 0, RL - b - 8); strokePath(c, s.P, RL + b + 8, 2 * RL); }
    else if (s.side) strokePath(c, s.P, giveWay(s.p) + 12, s.P.L);
    else if (s.p.BP){ strokePath(c, s.P, 0, 72 - ROAD_HALF - 8); strokePath(c, s.P, 72 + ROAD_HALF + 8, s.P.L); }
    else strokePath(c, s.P);
  }
  c.setLineDash([]);
  for (const s of segs){ // give-way lines where a side road meets the main road
    if (!s.side) continue;
    const q = pAt(s.P, giveWay(s.p)), nx = -Math.sin(q.a), ny = Math.cos(q.a), ux = Math.cos(q.a), uy = Math.sin(q.a);
    c.strokeStyle = 'rgba(255,255,255,0.9)'; c.lineWidth = 2; c.setLineDash([4, 4]);
    for (const o of [0, 5]){ c.beginPath(); c.moveTo(q.x + ux * o - nx * ROAD_HALF, q.y + uy * o - ny * ROAD_HALF); c.lineTo(q.x + ux * o + nx * ROAD_HALF, q.y + uy * o + ny * ROAD_HALF); c.stroke(); }
    c.setLineDash([]);
  }
  for (const p of list){ // stop lines either side of each crossing
    if (kindOf(p) !== 'crossing') continue;
    const R = p.road;
    c.save(); c.translate(R.cx, R.cy); c.rotate(Math.atan2(R.oy, R.ox));
    c.strokeStyle = '#fff'; c.lineWidth = 3;
    c.beginPath(); c.moveTo(-(R.bar + 3), 0); c.lineTo(-(R.bar + 3), -ROAD_HALF); c.stroke();
    c.beginPath(); c.moveTo(R.bar + 3, 0); c.lineTo(R.bar + 3, ROAD_HALF); c.stroke();
    c.restore();
  }
}
const giveWay = p => PT[p.type].jct === 'Y' ? 42 : ROAD_HALF + 4; // how far along the side road its give-way line is
function drawSpecials(c, list){ // tarmac over the rails at crossings; station platforms
  for (const p of list){
    const k = kindOf(p);
    if (k === 'crossing' && p.type === 'XD'){ // tarmac across the rails at a slant, rails drawn back over it
      const a = p.f === -1 ? -Math.PI / 4 : Math.PI / 4;
      c.save(); inPieceFrame(c, p); c.translate(72, 0);
      c.save(); c.beginPath(); c.rect(-64, -15, 128, 30); c.clip(); c.rotate(a);
      c.fillStyle = '#6e737b'; c.fillRect(-64, -ROAD_HALF, 128, ROAD_HALF * 2);
      c.fillStyle = 'rgba(255,255,255,0.9)'; for (let i = -4; i <= 4; i++){ c.fillRect(i * 6 - 1, -ROAD_HALF, 2, 3); c.fillRect(i * 6 - 1, ROAD_HALF - 3, 2, 3); }
      c.restore();
      c.save(); c.rotate(a); c.beginPath(); c.rect(-64, -ROAD_HALF, 128, ROAD_HALF * 2); c.clip(); c.rotate(-a);
      c.strokeStyle = '#2e2e33'; c.lineWidth = 3;
      for (const y of [-6.5, 6.5]){ c.beginPath(); c.moveTo(-64, y); c.lineTo(64, y); c.stroke(); }
      c.restore(); c.restore();
    } else if (k === 'crossing'){
      c.save(); inPieceFrame(c, p); c.translate(72, 0);
      c.fillStyle = '#6e737b'; c.fillRect(-ROAD_HALF, -15, ROAD_HALF * 2, 30);
      c.fillStyle = 'rgba(255,255,255,0.9)';
      for (let i = -3; i <= 3; i++){ c.fillRect(i * 5 - 1, -15, 2, 3); c.fillRect(i * 5 - 1, 12, 2, 3); }
      c.strokeStyle = '#2e2e33'; c.lineWidth = 3;
      for (const y of [-6.5, 6.5]){ c.beginPath(); c.moveTo(-ROAD_HALF, y); c.lineTo(ROAD_HALF, y); c.stroke(); }
      c.restore();
    } else if (k === 'station'){
      c.save(); inPieceFrame(c, p); c.translate(72, p.f * 27); if (p.f < 0) c.scale(1, -1);
      c.fillStyle = 'rgba(0,0,0,0.16)'; rr(c, -56, -8, 116, 24, 3); c.fill();
      c.fillStyle = '#d9d0c1'; rr(c, -58, -11, 116, 24, 3); c.fill();
      c.fillStyle = '#ffd23f'; c.fillRect(-58, -11, 116, 3);
      c.fillStyle = 'rgba(0,0,0,0.2)'; rr(c, -22, 0, 48, 15, 3); c.fill();
      c.fillStyle = '#d64545'; rr(c, -24, -3, 48, 15, 3); c.fill();
      c.fillStyle = '#f2f2f2'; for (let i = 0; i < 4; i++) c.fillRect(-21 + i * 12, -3, 6, 15);
      c.fillStyle = '#2d6cdf'; rr(c, 30, 1, 12, 8, 2); c.fill();
      for (const lx of [-50, 50]){ c.fillStyle = '#333'; circle(c, lx, 6, 3.2); c.fill(); c.fillStyle = '#ffe9a8'; circle(c, lx, 6, 1.8); c.fill(); }
      c.restore();
    }
  }
}
function drawHill(c, p){ // the tunnel, drawn over the trains
  const pts = [];
  for (let s = 18; s < p.L - 18; s += 4) pts.push(pAt(p.P, s));
  pts.push(pAt(p.P, p.L - 18));
  const line = () => { c.beginPath(); c.moveTo(pts[0].x, pts[0].y); for (const q of pts) c.lineTo(q.x, q.y); c.stroke(); };
  c.lineCap = 'butt'; c.lineJoin = 'round';
  c.save(); c.translate(3, 5); c.strokeStyle = 'rgba(0,0,0,0.2)'; c.lineWidth = 80; line(); c.restore();
  c.strokeStyle = '#4c9a3c'; c.lineWidth = 80; line();
  c.strokeStyle = '#5db34a'; c.lineWidth = 64; line();
  c.strokeStyle = '#6fc25a'; c.lineWidth = 38; line();
  const m = pAt(p.P, p.L / 2);
  c.fillStyle = '#7fcf68'; circle(c, m.x - 6, m.y - 6, 16); c.fill();
  c.fillStyle = '#e63946'; circle(c, m.x + 10, m.y + 8, 3); c.fill();
  c.fillStyle = '#ffd23f'; circle(c, m.x - 14, m.y + 14, 3); c.fill();
  for (const [s, dir] of [[18, -1], [p.L - 18, 1]]){
    const q = pAt(p.P, s);
    c.save(); c.translate(q.x, q.y); c.rotate(q.a);
    c.fillStyle = '#9a8e84'; rr(c, -6, -32, 12, 64, 4); c.fill();
    c.strokeStyle = 'rgba(0,0,0,0.25)'; c.lineWidth = 1.2;
    for (const y of [-18, -4, 10, 24]){ c.beginPath(); c.moveTo(-6, y); c.lineTo(6, y); c.stroke(); }
    c.fillStyle = '#2a211c'; rr(c, dir > 0 ? 2 : -6, -18, 4, 36, 2); c.fill();
    c.restore();
  }
}
function drawSet(c, list, hills){ // everything static about some pieces (used for ghosts and moving groups)
  drawRoads(c, list); drawPieces(c, list); drawSpecials(c, list);
  if (hills) for (const p of list) if (kindOf(p) === 'tunnel') drawHill(c, p);

// A position on the track is { p: piece, s: distance along it from end 0, d: +1 heading to end 1 or -1 }.
// A train keeps the position of its engine's nose (d = the way the engine faces) and dir: +1 when it's

// away); tap a piece to turn or flip it, or scenery to change its look; press and hold to select a
// whole track or road; drag across empty grass to select a box of pieces. With several selected,
// dragging any of them moves them all and tapping one turns them all. Tapping an open end picks it

  const pad = Math.max(12, 10 / view.z), hw = WID * U / 2 + pad;
  let best = null, bd = 1e18;
  for (const tr of trains) if (!tr.lost) for (let k = 0; k < tr.geo.length; k++){
    const g = tr.geo[k], dx = x - g.x, dy = y - g.y, ca = Math.cos(-g.a), sa = Math.sin(-g.a);
    const lx = dx * ca - dy * sa, ly = dx * sa + dy * ca;

  }

}
function hitPiece(x, y){ // the rails or road, or a special piece's platform / hill / road
  const pad = Math.max(4, 8 / view.z);
  let best = null, bd = 1e18;
  for (const p of pieces){
    const R = halfW(p) + pad;
    if (x < p.bb[0] - R || x > p.bb[2] + R || y < p.bb[1] - R || y > p.bb[3] + R) continue;
    let d = pMinD2(p.P, x, y, 1) - R * R;
    if (p.obs) for (const o of p.obs) d = Math.min(d, pMinD2(o.P, x, y, 2) - o.hw * o.hw);

}
function hitEnd(x, y){

}
function hitCar(x, y){

  for (const c of cars){
    const dx = x - c.x, dy = y - c.y, ca = Math.cos(c.a), sa = Math.sin(c.a);
    if (Math.abs(dx * ca + dy * sa) > c.half + pad || Math.abs(dy * ca - dx * sa) > VT[c.type].wid / 2 + pad) continue;
    const d = dx * dx + dy * dy; if (d < bd){ bd = d; best = c; }

}

}

cv.addEventListener('pointerdown', e => {

      if (nd){ sPick(); nd.w = w; drags.set(e.pointerId, nd); return; }
      if (PT[d.piece.type].link && !(sel.has(d.piece) && sel.size > 1)){ drags.delete(e.pointerId); sNo(); sparkle(d.piece.cx, d.piece.cy, 4); return; } // a merge's bit of road stays put

    if (!props.includes(d.prop)){ drags.delete(e.pointerId); return; }
    if (Math.hypot(p.x - d.sx, p.y - d.sy) > 9){
      const q = d.prop, w0 = toW(d.sx, d.sy);
      props.splice(props.indexOf(q), 1); layoutChanged(false); sPick();
      const nd = { kind: 'prop', prop: q, src: { x: q.x, y: q.y }, gdx: q.x - w0.x, gdy: q.y - w0.y, moved: true };
      drags.set(e.pointerId, nd); movePiece(nd, p);
    }
  } else if (d.kind === 'vpend'){
    if (!cars.includes(d.car)){ drags.delete(e.pointerId); return; }
    if (Math.hypot(p.x - d.sx, p.y - d.sy) > 9){ // pick it up (a plain car becomes one of his)
      const v = d.car, w0 = toW(d.sx, d.sy);
      cars.splice(cars.indexOf(v), 1); v.mine = true; sPick();
      const nd = { kind: 'veh', car: v, src: { l: v.lane, s: v.s }, gdx: v.x - w0.x, gdy: v.y - w0.y, moved: true };
      drags.set(e.pointerId, nd); movePiece(nd, p);
    }

    const dist = Math.hypot(w.x - d.last.x, w.y - d.last.y), n = Math.ceil(dist / 10);

  else movePiece(d, p);
}
function onUp(e){

  else if (d.kind === 'pend'){
    if (d.long || !pieces.includes(d.piece)){ /* the long press already selected its track, or the piece has gone */ }
    else if (d.end) endTap(d.end);
    else if (validPick() && validPick().net === 'road' && netOf(d.piece.type) === 'road' && d.piece !== validPick().p){
      const P = validPick(); pickEnd = null;

/* ================= bedtime ================= */
// A play timer the parent sets (10 minutes to start with), so the game ends itself instead of being taken away.
// It winds down gently: a soft chime a minute before, then night falls, a lullaby plays, everything stops, and a
// sleepy night-time cover (a moon, twinkling stars, 💤) fades in over the whole game. Taps do nothing then.
// ⏰ in the parent corner (press and hold 1.2 s) steps the time through 10, 20 and 30 minutes and off, and wakes
// everything up again once it's asleep. Only time with the game on screen counts. It's saved with the setting and
// shared with the other game (the home-screen app can switch between them), and starts afresh after a 20-minute break.
// (The same block is in index.html and builder.html.)
const BED_KEY = 'choochoo-bedtime-v1', BED_OPTS = [10, 20, 30, 0], BED_BREAK = 20 * 60 * 1000;
const bed = { min: 10, used: 0, asleep: false, t: 0, warned: false, saveT: 0, hold: 0, wall: Date.now() };
const bBed = $('bBed'), sleepEl = $('sleep');
const BED_PARENT = ['bBed', 'bBell', 'bMute', 'bFull']; // the only buttons that still work while it's asleep
const sBedWarn = () => { tone(1047, 'sine', 0, 0.02, 0.8, 0.07); tone(784, 'sine', 0.35, 0.02, 1.1, 0.07); };
const sLullaby = () => [392, 392, 587, 587, 659, 659, 587, 523, 523, 494, 494, 440, 440, 392].forEach((f, i) => tone(f, 'sine', i * 0.42 + (i >= 7 ? 0.42 : 0), 0.04, i === 6 || i === 13 ? 1.1 : 0.6, 0.1));
function bedSave(){ try { window.localStorage.setItem(BED_KEY, JSON.stringify({ min: bed.min, used: bed.used, asleep: bed.asleep, at: Date.now() })); } catch (_) {} }
function bedLabel(){ bBed.textContent = '⏰' + (bed.min || '∞'); }
function setLight(){ const tl = $('bLight').firstElementChild; tl.classList.toggle('go', going); tl.classList.toggle('stop', !going); }
function goToSleep(quiet){
  bed.asleep = true; bed.t = quiet ? 10 : 0; bedSave();
  nightT = 1; if (quiet) night = 1; $('bSky').textContent = '☀️';
  going = false; setLight();
  sleepEl.classList.add('show'); // (it takes taps straight away, and fades in a moment later)
  if (quiet) sleepEl.classList.add('on'); else sLullaby();
}
function wakeUp(){
  bed.asleep = false; bed.used = 0; bed.warned = false; bed.t = 0; bedSave();
  sleepEl.classList.remove('show', 'on');
  nightT = 0; $('bSky').textContent = '🌙'; going = true; setLight(); sDay();
}
function nextBedtime(){
  bed.min = BED_OPTS[(BED_OPTS.indexOf(bed.min) + 1) % BED_OPTS.length]; bed.used = 0; bed.warned = false;
  bedLabel(); bedSave(); tone(bed.min ? 440 + bed.min * 20 : 330, 'sine', 0, 0.01, 0.3, 0.15);
}
// first thing every frame: true once it's asleep and everything has stopped (the rest of the update is skipped)
function bedTick(dt){
  const now = Date.now();
  if (now - bed.wall > BED_BREAK){ bed.used = 0; bed.warned = false; if (bed.asleep) wakeUp(); } // back after a long break
  bed.wall = now;
  if (bed.hold && NOW - bed.hold > 1.2){ bed.hold = 0; bBed.classList.remove('hold'); bed.asleep ? wakeUp() : nextBedtime(); }
  if (bed.asleep){
    bed.t += dt;
    if (bed.t > 2.5) sleepEl.classList.add('on');
    return bed.t > 9; // stopped, and the lullaby's finished
  }
  if (!bed.min) return false;
  bed.used += dt;
  if ((bed.saveT -= dt) <= 0){ bed.saveT = 5; bedSave(); }
  const left = bed.min * 60 - bed.used;
  if (!bed.warned && left < 60){ bed.warned = true; sBedWarn(); }
  if (left <= 0) goToSleep(false);
  return false;
}
bBed.addEventListener('pointerdown', e => { e.preventDefault(); e.stopPropagation(); audio(); bed.hold = NOW || 1e-3; bBed.classList.add('hold'); });
for (const t of ['pointerup', 'pointercancel', 'pointerleave']) bBed.addEventListener(t, () => { bed.hold = 0; bBed.classList.remove('hold'); });
window.addEventListener('pagehide', bedSave);
try { // carry on from the other game (or from a moment ago), unless it's been a long break
  const st = JSON.parse(window.localStorage.getItem(BED_KEY) || 'null');
  if (st){
    if (BED_OPTS.includes(st.min)) bed.min = st.min;
    if (Date.now() - st.at < BED_BREAK){ bed.used = st.used || 0; if (st.asleep) goToSleep(true); }
  }
} catch (_) {}
bedLabel();

/* ================= loop ================= */
function update(dt){
  if (bedTick(dt)) return;
  night += clamp(nightT - night, -dt * 1.2, dt * 1.2);
  const vk = 1 - Math.exp(-dt * 6);
  if (Math.abs(vt.z - view.z) > 1e-4 || Math.abs(vt.x - view.x) > 0.05 || Math.abs(vt.y - view.y) > 0.05){
    view.z += (vt.z - view.z) * vk; view.x += (vt.x - view.x) * vk; view.y += (vt.y - view.y) * vk; bgDirty = true;
  } else if (view.z !== vt.z || view.x !== vt.x || view.y !== vt.y){ Object.assign(view, vt); bgDirty = true; }
  for (const d of drags.values()){
    if (d.kind === 'pend' && !d.long && NOW - d.t0 > 0.55){ d.long = true; selectComponent(d.piece); }
    if (d.kind === 'bend' && d.dirty && d.w && NOW - d.t > 0.12){ // re-plan the stretch preview, at most ~8 times a second
      d.dirty = false; d.t = NOW;
      const pl = bendPlan(d.anchors, d.w, 1500, d.net), n0 = d.plan && d.ok ? d.plan.length : 0;
      if (pl){ d.plan = pl; d.ok = true; } else d.ok = false;
      const n1 = d.ok ? d.plan.length : 0;
      if (n1 !== n0) tone(n1 > n0 ? 620 : 440, 'triangle', 0, 0.003, 0.06, 0.1);
    }
  }
  for (let i = anims.length - 1; i >= 0; i--){ // a track sliding over to join another
    const a = anims[i]; a.t += dt;
    if (a.t < a.dur) continue;
    anims.splice(i, 1);
    const res = groupEval(a.st, a.pose);
    if (res.ok){ commitGroup(res); sel = new Set(); bgDirty = true; } else { restoreGroup(a.st, false); sNo(); }
  }
  if (fillQ && (fillQ.t -= dt) <= 0){ // pieces being laid one by one to fill a gap
    const s = fillQ.steps.shift(), N = s.link ? layLink(s) : place(s.t, s.pose);
    if (N) afterPlace(N); else sNo();
    fillQ = N && fillQ.steps.length ? { steps: fillQ.steps, t: 0.12 } : null;
  }
  histTick();
  const target = SPEEDS[speedIdx];
  for (const tr of trains){
    if (tr.lost) continue;
    tr.bounce = Math.max(0, tr.bounce - dt); tr.cool = Math.max(0, tr.cool - dt);
    tr.dragV *= Math.exp(-dt * 6);
    for (const car of tr.cars) car.jump = Math.max(0, car.jump - dt);
    tr.stuck = false; tr.holding = false; tr.qroot = null;
    if (tr.drag || mode === 'build'){ tr.v = 0; continue; }
    tr.pause = Math.max(0, tr.pause - dt);
    const base = going && tr.pause <= 0 ? target : 0, feats = [], sc = scan(lead(tr), 220, tr, feats);
    let room = 1e9, kind = null;
    const limit = (r, k) => { if (r < room){ room = r; kind = k; } };
    if (sc.what === 'train') limit(Math.max(0, sc.dist - 16), 'train');
    else if (sc.what === 'end') limit(sc.dist, 'end');
    for (const f of feats){
      if (f.kind === 'crossing'){
        const x = xsOf(f.p), lim = f.dist - f.p.road.stopT;
        if (f.dist < 150) x.approach = true;
        if (!x.trainsGo && lim > -0.5) limit(Math.max(0, lim), 'signal');
      } else if (tr.cool <= 0) limit(f.dist, 'station');
    }
    let want = base;
    if (kind === 'end' || kind === 'station') want = Math.min(want, Math.max(base ? 14 : 0, (room - (kind === 'end' ? 2 : 0)) * 2.5));
    else if (kind) want = Math.min(want, room * 2.5);
    tr.v = want < tr.v ? Math.max(want, tr.v - 320 * dt) : Math.min(want, tr.v + 70 * dt);
    const step = Math.min(tr.v * dt, room);
    if (step > 0){ advance(tr, step); tr.odo += step; tr.iv = bodyIv(tr); }
    tr.holding = tr.pause > 0 || (kind === 'signal' && room - step < 3);
    if (!base){ tr.blockT = 0; continue; }
    if (kind === 'end' && room - step < 0.5) bump(tr);
    else if (kind === 'station' && room - step < 0.5){ tr.pause = 1.8; tr.cool = 6; tr.v = 0; tr.holding = true; stats.dings++; sDing(); }
    else if (kind === 'train' && room < 3){
      // In a queue behind a train that's stopped at a station, a crossing or a buffer: just wait. (The
      // queue is followed back to that train, so two trains nose to nose never wait on each other.)
      // Behind a train that isn't moving for any such reason: give it 4 s, or back away after 1.2 s
      // if that train is itself stuck (a jam, or nose to nose with us), so a queue clears in a ripple.
      const root = sc.tr && (sc.tr.holding ? sc.tr : sc.tr.qroot);
      if (root && root !== tr && root.holding){ tr.blockT = 0; tr.qroot = root; }
      else { tr.stuck = true; tr.blockT += dt; if (tr.blockT > (sc.tr && sc.tr.stuck ? 1.2 : 4)) tryReverse(tr); }
    }
    else tr.blockT = 0;
  }
  for (const tr of trains){
    if (tr.lost) continue;
    computeGeo(tr);
    const speed = tr.drag ? tr.dragV : Math.max(tr.v, tr.dragV);
    tr.smokeT -= dt;
    if (speed > 6 && tr.smokeT <= 0 && !inTunnel(tr.nose)){
      const g = tr.geo[0], ch = g.len / 2 - 12;
      spawnPuff(g.x + Math.cos(g.a) * ch, g.y + Math.sin(g.a) * ch);
      tr.smokeT = 0.34 - Math.min(1, speed / 150) * 0.22;
    }
  }
  updateCars(dt);
  updateCrossings(dt);
  for (const q of props){ q.wig = Math.max(0, q.wig - dt); q.flap = Math.max(0, q.flap - dt); }
  updateSite(dt);
  if (clearHold && NOW - clearHold > 1.2){ clearHold = 0; bClear.classList.remove('hold'); clearTable(); }
  for (let i = puffs.length - 1; i >= 0; i--){
    const p = puffs[i]; p.life += dt;
    if (p.life > p.max){ puffs.splice(i, 1); continue; }
    p.x += p.vx * dt; p.y += p.vy * dt; p.r += p.vr * dt;
  }
  for (let i = rings.length - 1; i >= 0; i--){ rings[i].life += dt; if (rings[i].life > rings[i].max) rings.splice(i, 1); }
  for (let i = fx.length - 1; i >= 0; i--){
